/* ============================================================
   ໂໝດນຳສະເໜີ — ສະແດງແຕ່ໜ້າຈໍແອັບ
   ============================================================ */
.present{ display:flex; flex-direction:column; gap:14px; min-height:72vh; padding:4px 0 10px; }
.present:fullscreen{ background:var(--bg); padding:22px 26px; justify-content:center; }

.pbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.pgroups{ display:flex; gap:6px; flex-wrap:wrap; flex:1; }
.pg{ font:600 12px/1 var(--f); color:var(--muted); background:var(--card); border:1px solid var(--line);
     padding:7px 12px; border-radius:999px; cursor:pointer; transition:.15s; }
.pg:hover{ color:var(--ink); border-color:var(--brand); }
.pg.on{ background:var(--brand); border-color:var(--brand); color:#fff; }

.pctl{ display:flex; gap:6px; }
.pbtn{ width:34px; height:34px; display:grid; place-items:center; font-size:13px; cursor:pointer;
       color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:10px; transition:.15s; }
.pbtn:hover{ color:var(--ink); border-color:var(--brand); }
.pbtn.on{ background:var(--brand); border-color:var(--brand); color:#fff; }

.pstage{ display:flex; align-items:center; justify-content:center; gap:clamp(14px,4vw,56px); flex:1; min-height:0; }
.pphone{ position:relative; }
.pphone::after{ content:''; position:absolute; inset:-34px -26px; border-radius:60px; z-index:-1;
  background:radial-gradient(closest-side, rgba(34,197,94,.16), transparent 72%); pointer-events:none; }
.pphone .phone{ transform:scale(1.12); transform-origin:center; }
.present:fullscreen .pphone .phone{ transform:scale(1.34); }

.pnav{ width:46px; height:46px; flex:none; display:grid; place-items:center; cursor:pointer;
       font:400 26px/1 var(--f); color:var(--muted); background:var(--card);
       border:1px solid var(--line); border-radius:50%; transition:.15s; }
.pnav:hover{ color:#fff; background:var(--brand); border-color:var(--brand); transform:scale(1.08); }

.pcap{ display:flex; align-items:baseline; justify-content:center; gap:12px; }
.pcap b{ font:700 16px/1.4 var(--f); color:var(--ink); }
.pcap span{ font:600 12px/1 var(--f); color:var(--muted); letter-spacing:.4px; }

.pstrip{ display:flex; gap:6px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:thin; }
.pstrip::-webkit-scrollbar{ height:5px; }
.pstrip::-webkit-scrollbar-thumb{ background:var(--line); border-radius:9px; }
.pt{ flex:none; max-width:132px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
     font:600 11px/1 var(--f); color:var(--muted); background:var(--card);
     border:1px solid var(--line); padding:7px 11px; border-radius:8px; cursor:pointer; transition:.15s; }
.pt:hover{ color:var(--ink); }
.pt.on{ background:var(--brand); border-color:var(--brand); color:#fff; }

@media (max-width:720px){
  .pphone .phone{ transform:scale(.92); }
  .pnav{ width:38px; height:38px; font-size:21px; }
  .pstage{ gap:6px; }
}

/* ============================================================
   D43 · ບັນຊີຮັບເງິນ (QR) ຂອງຄົນຂັບເອງ
   ============================================================ */
.scr .qrmini .tx em.amt{display:block;font-style:normal;font-size:19px;font-weight:800;
  color:var(--d-brand);font-family:var(--ui);letter-spacing:-.4px;margin-top:5px}

.scr .card2.qrcard{margin:12px;padding:16px 14px;text-align:center;background:#fff;
  border:1px solid var(--d-line);border-radius:18px;box-shadow:0 8px 22px rgba(225,37,43,.07)}
.scr .qrcard.off{background:var(--d-surface2);box-shadow:none}

.scr .qrtop{display:flex;align-items:center;gap:11px;text-align:left;padding-bottom:13px;
  border-bottom:1px dashed var(--d-line)}
.scr .qrtop>svg{width:26px;height:26px;flex:none;color:var(--d-brand)}
.scr .qrtop>div{flex:1;min-width:0}
.scr .qrtop b{display:block;font-size:13.5px;font-weight:700;color:var(--d-ink)}
.scr .qrtop span{display:block;font-size:10.5px;color:var(--d-dim);margin-top:2px}
.scr .vtag{display:inline-flex;align-items:center;gap:4px;flex:none;font-style:normal;
  font-size:10px;font-weight:700;padding:5px 9px;border-radius:999px}
.scr .vtag svg{width:12px;height:12px}
.scr .vtag.ok{background:var(--d-okbg);color:var(--d-ok)}
.scr .vtag.wait{background:var(--d-warnbg);color:var(--d-warn)}

.scr .qrbig{display:flex;justify-content:center;padding:16px 0 12px}
.scr .qrbig .qrimg{border-radius:12px;overflow:hidden;padding:9px;background:#fff;
  border:1px solid var(--d-line)}
.scr .qrwho b{display:block;font-size:14px;font-weight:800;color:var(--d-ink);letter-spacing:.3px}
.scr .qrwho span{display:block;font-size:12.5px;color:var(--d-ink2);font-family:var(--ui);
  letter-spacing:1.2px;margin-top:3px}
.scr .qracts{display:flex;gap:9px;margin-top:14px}
.scr .qracts a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;font-weight:700;padding:10px;border-radius:11px;cursor:pointer;
  background:var(--d-surface2);color:var(--d-ink2);border:1px solid var(--d-line)}
.scr .qracts a svg{width:15px;height:15px}
.scr .qracts a:active{background:var(--d-brandbg);color:var(--d-brand);border-color:var(--d-brand)}

.scr .qrempty{padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:7px}
.scr .qrempty svg{width:38px;height:38px;color:#c2cbd5}
.scr .qrempty b{font-size:13.5px;color:var(--d-ink2)}
.scr .qrempty span{font-size:11.5px;color:var(--d-dim);line-height:1.55;max-width:230px}

/* ຕາຕະລາງ “ເງິນໄປໃສ” */
.scr .flowtbl{padding:4px 0}
.scr .ft-row{display:flex;align-items:center;gap:11px;padding:11px 13px;
  border-bottom:1px solid var(--d-line)}
.scr .ft-row:last-child{border-bottom:0}
.scr .ft-row .ic{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:10px}
.scr .ft-row .ic svg{width:16px;height:16px}
.scr .ft-row .ic.cash{background:var(--d-warnbg);color:var(--d-warn)}
.scr .ft-row .ic.qr{background:var(--d-brandbg);color:var(--d-brand)}
.scr .ft-row .ic.wal{background:var(--d-okbg);color:var(--d-ok)}
.scr .ft-row .tx{flex:1;min-width:0}
.scr .ft-row .tx b{display:block;font-size:12.5px;font-weight:700;color:var(--d-ink)}
.scr .ft-row .tx span{display:block;font-size:10.5px;color:var(--d-dim);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr .ft-row .tag{flex:none;font-style:normal;font-size:9.5px;font-weight:700;
  padding:5px 8px;border-radius:7px;letter-spacing:.2px}
.scr .ft-row .tag.out{background:var(--d-surface2);color:var(--d-dim)}
.scr .ft-row .tag.in{background:var(--d-okbg);color:var(--d-ok)}

.scr .statrow2{display:flex;padding:2px 0}
.scr .statrow2>div{flex:1;text-align:center;padding:13px 6px}
.scr .statrow2>div+div{border-left:1px solid var(--d-line)}
.scr .statrow2 b{display:block;font-size:19px;font-weight:800;color:var(--d-ink);
  font-family:var(--ui);letter-spacing:-.4px}
.scr .statrow2 span{display:block;font-size:10.5px;color:var(--d-dim);margin-top:3px}

/* ແຖບບອກປາຍທາງຂອງເງິນ ໃນໜ້າຈົບຖ້ຽວ */
.scr .card2.gonote{display:flex;align-items:center;gap:9px;margin-top:8px;padding:11px 13px;
  background:var(--d-surface2);border:1px solid var(--d-line)}
.scr .gonote svg{width:17px;height:17px;flex:none;color:var(--d-ink2)}
.scr .gonote span{font-size:11.5px;color:var(--d-ink2)}
.scr .gonote b{color:var(--d-ink);font-weight:700}

/* ============================================================
   D43/D44 · ລາຍການບັນຊີ QR + ຟອມແກ້ໄຂ + ແປ້ນພິມໃນແອັບ
   ============================================================ */
.scr .qrow{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--d-line)}
.scr .qrow:last-child{border-bottom:0}
.scr .qrow.main{background:var(--d-brandbg)}
.scr .qrow .lg{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;
  background:var(--d-surface2);color:var(--d-ink2)}
.scr .qrow.main .lg{background:#fff;color:var(--d-brand)}
.scr .qrow .lg svg{width:17px;height:17px}
.scr .qrow .tx{flex:1;min-width:0;cursor:pointer}
.scr .qrow .tx>b{display:block;font-size:12.5px;font-weight:700;color:var(--d-ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr .qrow .tx>span{display:block;font-size:10.5px;color:var(--d-dim);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr .qrow .tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.scr .qrow .tags em{font-style:normal;font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;
  background:var(--d-surface2);color:var(--d-dim)}
.scr .qrow .tags em.on{background:var(--d-brand);color:#fff}
.scr .qrow .tags em.ok{background:var(--d-okbg);color:var(--d-ok)}
.scr .qrow .tags em.wait{background:var(--d-warnbg);color:var(--d-warn)}
.scr .qacts{display:flex;gap:4px;flex:none}
.scr .qacts a{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;cursor:pointer;
  background:var(--d-surface2);color:var(--d-ink2)}
.scr .qrow.main .qacts a{background:#fff}
.scr .qacts a svg{width:15px;height:15px}
.scr .qacts a:active{background:var(--d-brand);color:#fff}
.scr .qacts a.del:active{background:var(--d-bad);color:#fff}

/* ຟອມ D44 */
.scr .card2.qrprev{display:flex;align-items:center;gap:13px;margin:12px;padding:13px}
.scr .qrprev.dim{background:var(--d-surface2)}
.scr .qrprev .qrimg{border-radius:10px;overflow:hidden;padding:7px;background:#fff;border:1px solid var(--d-line)}
.scr .qrprev .phbox{width:132px;height:132px;flex:none;display:grid;place-items:center;border-radius:10px;
  border:2px dashed var(--d-line);color:#c2cbd5}
.scr .qrprev .phbox svg{width:38px;height:38px}
.scr .qrprev .tx{flex:1;min-width:0}
.scr .qrprev .tx b{display:block;font-size:13px;font-weight:700;color:var(--d-ink)}
.scr .qrprev .tx span{display:block;font-size:11px;color:var(--d-dim);margin-top:4px;line-height:1.55}

.scr .card2.updrop{margin:0 12px;padding:24px 16px;text-align:center;cursor:pointer;
  border:2px dashed var(--d-line);background:var(--d-surface2)}
.scr .updrop svg{width:34px;height:34px;color:var(--d-brand)}
.scr .updrop b{display:block;font-size:13px;color:var(--d-ink);margin-top:9px}
.scr .updrop span{display:block;font-size:11px;color:var(--d-dim);margin-top:5px;line-height:1.6}
.scr .updrop:active{border-color:var(--d-brand);background:var(--d-brandbg)}
.scr .card2.upok{display:flex;align-items:center;gap:10px;margin:0 12px;padding:13px;
  background:var(--d-okbg);border:1px solid rgba(18,161,80,.28)}
.scr .upok>svg{width:19px;height:19px;flex:none;color:var(--d-ok)}
.scr .upok>div{flex:1;min-width:0}
.scr .upok b{display:block;font-size:12.5px;color:var(--d-ok)}
.scr .upok span{display:block;font-size:10.5px;color:var(--d-ink2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr .upok a{flex:none;font-size:11px;font-weight:700;color:var(--d-brand);cursor:pointer}

.scr .fld .inp.tap{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.scr .fld .inp.tap svg{width:15px;height:15px;flex:none;color:var(--d-dim)}
.scr .fld .inp.bad{border-color:var(--d-bad)}
.scr .fld label em.err{font-style:normal;color:var(--d-bad);font-weight:600}

/* ---------- ແປ້ນພິມໃນແອັບ ---------- */
.scr .kbwrap{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.scr .kbmask{flex:1;background:rgba(16,23,32,.34)}
.scr .kbsheet{background:#fff;border-top:1px solid var(--d-line);border-radius:18px 18px 0 0;
  padding:12px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(16,23,32,.14)}
.scr .kbhead{display:flex;align-items:center;gap:9px;padding:0 4px 9px}
.scr .kbhead b{flex:1;font-size:12.5px;font-weight:700;color:var(--d-ink)}
.scr .kbhead span{font-size:10.5px;color:var(--d-dim);font-family:var(--ui)}
.scr .kbhead i{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;cursor:pointer;
  background:var(--d-surface2);color:var(--d-ink2)}
.scr .kbhead i svg{width:14px;height:14px}
.scr .kbval{margin:0 2px 11px;padding:11px 13px;border-radius:11px;background:var(--d-surface2);
  border:1.5px solid var(--d-brand);font-size:16px;font-weight:700;color:var(--d-ink);
  font-family:var(--ui);letter-spacing:1.1px;min-height:44px;display:flex;align-items:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr .kbval.ph{color:var(--d-dim);font-weight:500}
.scr .kbval .car{display:inline-block;width:2px;height:19px;margin-left:2px;background:var(--d-brand);
  animation:kbblink 1s steps(1) infinite}
@keyframes kbblink{50%{opacity:0}}
.scr .kbkeys{display:grid;gap:6px}
.scr .kbsheet.num .kbkeys{grid-template-columns:repeat(3,1fr)}
.scr .kbsheet.abc .kbkeys{grid-template-columns:repeat(10,1fr)}
.scr .kbkeys b{display:grid;place-items:center;height:44px;border-radius:9px;cursor:pointer;
  background:var(--d-surface2);border:1px solid var(--d-line);color:var(--d-ink);
  font-size:17px;font-weight:600;font-family:var(--ui);user-select:none}
.scr .kbsheet.abc .kbkeys b{height:38px;font-size:14px}
.scr .kbkeys b:active{background:var(--d-brand);border-color:var(--d-brand);color:#fff}
.scr .kbkeys b.gap{background:none;border:0;cursor:default;pointer-events:none}
.scr .kbkeys b.fn{background:#e9edf2;font-size:11.5px;font-weight:700;color:var(--d-ink2);font-family:var(--lao)}
.scr .kbkeys b.fn svg{width:19px;height:19px}
.scr .kbsheet.abc .kbkeys b.wide{grid-column:span 6}
.scr .kbsheet.abc .kbkeys b.fn:not(.wide){grid-column:span 2}
.scr .kbbar{display:flex;gap:8px;margin-top:10px;padding:0 2px}
.scr .kbbar a{flex:1;display:grid;place-items:center;height:42px;border-radius:11px;cursor:pointer;
  font-size:13px;font-weight:700;background:var(--d-surface2);color:var(--d-ink2);border:1px solid var(--d-line)}
.scr .kbbar a.ok{flex:1.6;background:var(--d-brand);border-color:var(--d-brand);color:#fff}

/* ============================================================
   ແທັບ “ວິທີໃຊ້ແອພ” — ເລົ່າການນຳໃຊ້ເປັນຂັ້ນຕອນ
   ============================================================ */
.ubar{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 22px}
.ustep{display:flex;align-items:center;gap:8px;padding:8px 13px 8px 9px;border-radius:999px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);font-family:var(--lao);
  font-size:12.5px;transition:.15s}
.ustep>b{width:21px;height:21px;flex:none;display:grid;place-items:center;border-radius:50%;
  background:var(--panel2);color:var(--muted);font:700 11px/1 var(--ui)}
.ustep:hover{color:var(--txt);border-color:var(--brand)}
.ustep.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(225,37,43,.24)}
.ustep.on>b{background:rgba(255,255,255,.24);color:#fff}
.ustep[data-u="-1"]{padding:8px 15px;font-weight:600}

.usteps{display:flex;flex-direction:column;gap:20px}
.ucard{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow)}
.uhead{display:flex;align-items:center;gap:14px;padding:16px 20px;
  background:linear-gradient(90deg,rgba(225,37,43,.07),transparent 62%);
  border-bottom:1px solid var(--line)}
.uhead>i{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;
  background:var(--brand);color:#fff;font:800 18px/1 var(--ui);font-style:normal;
  box-shadow:0 5px 14px rgba(225,37,43,.28)}
.uhead b{display:block;font-size:16.5px;font-weight:700;color:var(--ink);font-family:var(--lao)}
.uhead span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-family:var(--lao)}

.ubody{display:grid;grid-template-columns:minmax(0,auto) minmax(280px,1fr);gap:26px;padding:20px}
.ushots{display:flex;gap:14px;flex-wrap:wrap}
.ushots figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.ushots figcaption{font-size:11.5px;color:var(--muted);font-family:var(--lao);text-align:center;
  max-width:166px;line-height:1.4}
.ucard .thumb{width:var(--tw,166px);height:var(--th,372px);flex:none;cursor:pointer;
  border-radius:14px;background:var(--panel2);transition:.18s}
.ucard .thumb:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(16,23,32,.12)}

.unotes{display:flex;flex-direction:column;gap:14px;min-width:0}
.ulist h4{display:flex;align-items:center;gap:7px;margin:0 0 9px;font-size:12px;font-weight:700;
  letter-spacing:.4px;text-transform:uppercase;font-family:var(--ui)}
.ulist h4 svg{width:15px;height:15px;flex:none}
.ulist.do h4{color:var(--brand)}
.ulist.sys h4{color:var(--green)}
.ulist ol,.ulist ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:6px}
.ulist li{font-size:13.5px;color:var(--txt);font-family:var(--lao);line-height:1.6}
.ulist.do li::marker{color:var(--brand);font-weight:700}
.ulist.sys li::marker{color:var(--green)}
.utip{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;border-radius:12px;
  background:var(--brand-lt);border:1px solid var(--brand-bd)}
.utip svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--brand)}
.utip span{font-size:12.5px;color:var(--txt);font-family:var(--lao);line-height:1.6}
.utip b{color:var(--brand2)}

@media (max-width:1000px){
  .ubody{grid-template-columns:1fr;gap:18px}
  .ushots{justify-content:center}
}

/* ກັນບັກ SVG ບໍ່ມີຂະໜາດ → ຂະຫຍາຍເຕັມຈໍ (ເຄີຍເກີດກັບປຸ່ມອອກຈາກລະບົບ) */
h4>svg,.uhead svg,.ustep svg{width:15px;height:15px;flex:none}

/* ============================================================
   ແທັບ “ເດໂມເຕັມຈໍ” — ແອັບຈິງ ກົດໄດ້ ບໍ່ມີແຜງນັກພັດທະນາ
   ============================================================ */
.kiosk{display:flex;flex-direction:column;gap:12px;height:calc(100vh - 148px);min-height:560px}
.kiosk:fullscreen{height:100vh;padding:16px 20px;background:var(--bg);gap:10px}

.ktop{display:flex;align-items:center;gap:16px;flex:none;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;
  box-shadow:var(--shadow)}
.kwho{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.klogo{width:34px;height:34px;flex:none;border-radius:10px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(145deg,#f2545a,#d81c22);box-shadow:0 5px 13px rgba(216,28,34,.28)}
.klogo svg{width:100%;height:100%}
.kwho b{display:block;font-size:14px;font-weight:700;color:var(--ink);font-family:var(--lao)}
.kwho span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--lao)}

.kctl{display:flex;gap:6px;flex:none}
.kbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);transition:.15s}
.kbtn svg{width:17px;height:17px}
.kbtn:hover{color:var(--txt);border-color:var(--brand)}
.kbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.kbtn.wide{width:auto;padding:0 14px;font:600 12.5px/1 var(--lao);gap:6px}

.kstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  border-radius:18px;position:relative;overflow:hidden;
  background:radial-gradient(closest-side,rgba(225,37,43,.10),transparent 72%),var(--panel2)}
.kstage #demoPhone{transform:scale(var(--ks,1));transform-origin:center}

.khint{display:flex;align-items:center;gap:9px;flex:none;padding:11px 14px;border-radius:12px;
  background:var(--brand-lt);border:1px solid var(--brand-bd)}
.khint[hidden]{display:none}
.khint svg{width:17px;height:17px;flex:none;color:var(--brand)}
.khint span{font-size:13px;color:var(--txt);font-family:var(--lao);line-height:1.5}

.kjumps{display:flex;gap:6px;flex:none;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin}
.kjumps::-webkit-scrollbar{height:5px}
.kjumps::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.kj{flex:none;padding:8px 14px;border-radius:999px;cursor:pointer;font:600 12.5px/1 var(--lao);
  background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:.15s}
.kj:hover{color:var(--txt);border-color:var(--brand)}
.kj.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(225,37,43,.24)}

@media (max-width:820px){
  .kiosk{height:auto}
  .ktop{flex-wrap:wrap}
  .kstage{min-height:640px}
}

/* ============================================================
   ຕອບສະໜອງທຸກຈໍ — ມືຖື · ແທັບເລັດ · ເດັສທັອບ
   ============================================================ */
html,body{overflow-x:hidden}

/* ຕາຕະລາງກວ້າງ → ເລື່ອນຂ້າງໃນກ່ອງຂອງມັນເອງ ບໍ່ດັນໜ້າເວັບ */

   ຕອນໃຊ້ຈິງ: POST /api/v1/translate { text, from, to } */
function translate(text, to, from = 'lo'){
  if (!text || to === from) return { text, hit:true };
  const row = PHRASES.find(p => p[from] === text || p.lo === text || p.en === text);
  if (row && row[to]) return { text:row[to], hit:true };
  return { text, hit:false };          /* hit:false = ຕ້ອງເອີ້ນ API ຈິງ */
}

function detectLang(t){
  if (/[\u0E80-\u0EFF]/.test(t)) return 'lo';
  if (/[\u0E00-\u0E7F]/.test(t)) return 'th';
  if (/[\u4E00-\u9FFF]/.test(t)) return 'zh';
  return 'en';
}

/* ---------------- map art ---------------- */
function mapArt(variant='pickup', w=342, h=300){
  const road = (x1,y1,x2,y2,wd=9) =>
    `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#e2e5e9" stroke-width="${wd+3}" stroke-linecap="round"/>
     <path d="M${x1} ${y1}L${x2} ${y2}" stroke="#ffffff" stroke-width="${wd}" stroke-linecap="round"/>`;
  const blocks = [];
  for(let r=0;r<7;r++) for(let c=0;c<6;c++){
    const x = 4 + c*60 + ((r%2)?7:0), y = 6 + r*48;
    blocks.push(`<rect x="${x}" y="${y}" width="${34+(c%3)*9}" height="${22+(r%3)*6}" rx="2" fill="#e9e7e2"/>`);
    blocks.push(`<rect x="${x+40}" y="${y+8}" width="${16+(r%2)*8}" height="18" rx="2" fill="#eceae5"/>`);
  }
  let grid = '';
  for(let i=0;i<7;i++) grid += road(-10, 20+i*46, w+10, 14+i*46);
  for(let i=0;i<6;i++) grid += road(18+i*62, -10, 26+i*62, h+10);

  const poi = (x,y,t,sub='') => `<g><circle cx="${x}" cy="${y}" r="8" fill="#8c99a6"/><circle cx="${x}" cy="${y}" r="3" fill="#fff"/>
    <text x="${x+12}" y="${y+2}" font-size="9.5" font-family="Noto Sans Lao,sans-serif" fill="#5f6b7a">${t}</text>
    ${sub?`<text x="${x+12}" y="${y+12}" font-size="8" font-family="Noto Sans Lao,sans-serif" fill="#96a0ab">${sub}</text>`:''}</g>`;
  const flagG = (x,y) => `<g><path d="M${x} ${y}v-26" stroke="#3c4043" stroke-width="2.4"/><path d="M${x} ${y-26}h22v14h-22z" fill="#2fbf5f"/>
    <circle cx="${x}" cy="${y}" r="8" fill="#2b3038" fill-opacity=".18"/><circle cx="${x}" cy="${y}" r="5.5" fill="#2b3038" stroke="#fff" stroke-width="2"/></g>`;
  const flagR = (x,y) => `<g><path d="M${x} ${y}v-28" stroke="#3c4043" stroke-width="2.4"/><path d="M${x} ${y-28}h23v15h-23z" fill="#e1252b"/></g>`;
  const carMark = (x,y) => `<g transform="translate(${x},${y})"><g transform="translate(-27,-13)">${
    carArt('hatch','#1f2630','#4dd0f5').replace('<svg ','<svg width="54" height="25" ')}</g></g>`;

  let extras = '', marks = '';
  if(variant === 'pickup'){
    extras = poi(58, 196,'ຈັນສະຫວ່າງ') + poi(232, 96,'ຮ້ານຕັດຜົມ ສົມຫວັງ','ຮ້ານທຳຜົມບຸລຸດ')
      + `<text x="86" y="252" font-size="10" font-family="Noto Sans Lao,sans-serif" fill="#68727e">Chansawung Market</text>
         <text x="96" y="264" font-size="8.5" font-family="Noto Sans Lao,sans-serif" fill="#7c8794">ຕະຫຼາດຈັນສະຫວ່າງ</text>`;
    marks = flagG(w/2 - 8, h/2 + 4);
  } else if(variant === 'dest'){
    extras = `<rect x="0" y="${h*0.62}" width="${w}" height="28" fill="#a9d6ec"/>
      <path d="M0 ${h*0.58}h${w}" stroke="#cfe6f5" stroke-width="18"/>
      <rect x="30" y="${h*0.2}" width="120" height="70" rx="6" fill="#dde9d6"/>
      <text x="${w/2-52}" y="${h/2+34}" font-size="10.5" font-family="Noto Sans Lao,sans-serif" fill="#68727e">ທ່າອາກາດຍານນານາຊາດວັດໄຕ</text>
      <text x="${w/2-30}" y="${h/2+46}" font-size="8.5" font-family="Noto Sans Lao,sans-serif" fill="#7c8794">Wattay Int'l Airport</text>`;
    marks = flagR(w/2 - 6, h/2 + 10);
  } else if(variant === 'route' || variant === 'live'){
    const rp = `M40 ${h-40} C 90 ${h-70}, 120 ${h-120}, 176 ${h*0.5} S 250 70, ${w-56} 44`;
    extras = `<path d="${rp}" stroke="#e1252b" stroke-width="9" fill="none" stroke-linecap="round" opacity=".92"/>
      <path d="${rp}" stroke="#ffa9ac" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>`;
    marks = flagG(40, h-40) + flagR(w-56, 44) + (variant==='live' ? carMark(176, h*0.5) : '');
  }
  return `<svg class="mapart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">
    <rect width="${w}" height="${h}" fill="#f4f3ef"/>${blocks.join('')}${grid}${extras}${marks}</svg>`;
}

}

/* ============================================================
   ແຜນທີ່ແທ້ — Leaflet + OpenStreetMap
   ໃຊ້ໃນເດໂມ/preview/modal · ໃນ gallery ໃຊ້ SVG ຈຳລອງ (ໄວກວ່າ)
   ============================================================ */
let _mapSeq = 0;
const MAPS = {};                       /* id -> {map, o, layer} */
/* ໂໝດແຜນທີ່: ປົກກະຕິ (OSM) ຫຼື ດາວທຽມ (Esri World Imagery) */
const TILES = {
  street: { url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            attr:'© OpenStreetMap', max:19, lo:'ປົກກະຕິ' },
  sat:    { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            attr:'© Esri · Maxar', max:19, lo:'ດາວທຽມ' }
};
let MAP_MODE = 'street';
function setMapMode(m){
  if (!TILES[m]) return;
  MAP_MODE = m;
  Object.values(MAPS).forEach(o => { if (o.layer) o.layer.setUrl(TILES[m].url); });
  document.querySelectorAll('.matt2').forEach(a => a.textContent = TILES[m].attr);
  document.querySelectorAll('.modetag').forEach(a => a.textContent = TILES[m].lo);
  document.querySelectorAll('[data-act="toggleMapMode"]').forEach(b => b.classList.toggle('on', m === 'sat'));
  document.querySelectorAll('.map').forEach(el => el.classList.toggle('satmode', m === 'sat'));
}
const GEO = { pos:null, tried:false };  /* ຕຳແໜ່ງ GPS ປັດຈຸບັນ */

/* ໝຸດ SVG ສຳລັບແຜນທີ່ແທ້ */
const pinSVG = (color, label) => `<svg viewBox="0 0 24 34">
  <path d="M12 0a10 10 0 00-10 10c0 7.5 10 24 10 24s10-16.5 10-24A10 10 0 0012 0z" fill="${color}"/>
  <circle cx="12" cy="10" r="4.4" fill="#fff"/>${label ? `<text x="12" y="13" text-anchor="middle" font-size="7" fill="${color}" font-weight="700">${label}</text>` : ''}</svg>`;

/* ສ້າງ placeholder — mountMaps() ຈະຕິດ Leaflet ໃສ່ພາຍຫຼັງ */
function realMap(o){
  const id = 'lmap' + (++_mapSeq);
  const cfg = encodeURIComponent(JSON.stringify(o));
  return `<div class="map" style="height:${o.h}px" id="wrap_${id}">
    <div class="lmap" id="${id}" data-map="${cfg}"></div>
    ${o.pin ? `<div class="pinshadow"></div>
      <div class="centerpin">${pinSVG(o.pin === 'dest' ? '#e1252b' : '#12a150')}</div>
      <div class="droptip">ລາກແຜນທີ່ເພື່ອປັບຈຸດ</div>` : ''}
    ${o.gps ? `<div class="gpsbtn" data-act="useGps">${I('locate')}</div>` : ''}
    ${o.btns === false ? '' : `<div class="mapbtns" style="top:${o.btnTop || 10}px">
      <div class="mbtn">${I('traffic')}</div>
      <div class="mbtn mapmode ${MAP_MODE === 'sat' ? 'on' : ''}" data-act="toggleMapMode" title="ສະຫຼັບແຜນທີ່">${I('layers')}</div>
      <div class="mbtn blue" data-act="useGps">${I('locate')}</div></div>`}
    ${o.btns === false ? `<div class="mbtn mapmode mini ${MAP_MODE === 'sat' ? 'on' : ''}" data-act="toggleMapMode">${I('layers')}</div>` : ''}
    <div class="modetag">${TILES[MAP_MODE].lo}</div>

}

/* ຕິດ Leaflet ໃສ່ທຸກ placeholder ທີ່ຍັງບໍ່ໄດ້ຕິດ */
function mountMaps(onMove){
  document.querySelectorAll('.lmap[data-map]').forEach(el => {
    if (el._mounted) return;
    el._mounted = true;
    let o = {};
    try { o = JSON.parse(decodeURIComponent(el.dataset.map)); } catch(e){}
    /* ບໍ່ມີເນັດ / Leaflet ໂຫຼດບໍ່ໄດ້ → ໃຊ້ແຜນທີ່ SVG ຈຳລອງແທນ */
    if (typeof L === 'undefined'){ el.outerHTML = mapArt(o.variant || 'pickup', 342, o.h || 200); return; }
    const c = o.center || [CFG.center.lat, CFG.center.lng];
    const map = L.map(el, { zoomControl:false, attributionControl:false, dragging:!!o.pin || !!o.drag,
      scrollWheelZoom:false, doubleClickZoom:!!o.pin, touchZoom:!!o.pin, keyboard:false, tap:true });
    const layer = L.tileLayer(TILES[MAP_MODE].url, { maxZoom:19 }).addTo(map);
    MAPS[el.id] = { map, o, layer };
    if (o.nav){
      /* ໂໝດນຳທາງ — ເສັ້ນທາງ ແລະ ລົດ ຖືກຜູກໂດຍ navBindMaps() */
      map.setView(o.center || c, o.zoom || 16);
      if (typeof NAV !== 'undefined' && NAV.R) navBindMaps();
    } else if (o.route && o.route.length === 2){
      /* ໃຊ້ເສັ້ນທາງຈິງຖ້າມີ (o.line) · ບໍ່ດັ່ງນັ້ນເສັ້ນຊື່ລະຫວ່າງ 2 ຈຸດ */
      const pts = (o.line && o.line.length > 2) ? o.line : o.route;
      const line = L.polyline(pts, { color:'#e1252b', weight:6, opacity:.9, lineCap:'round', lineJoin:'round' }).addTo(map);
      L.marker(o.route[0], { icon:L.divIcon({ html:pinSVG('#12a150'), className:'', iconSize:[24,34], iconAnchor:[12,34] }) }).addTo(map);
      L.marker(o.route[1], { icon:L.divIcon({ html:pinSVG('#e1252b'), className:'', iconSize:[24,34], iconAnchor:[12,34] }) }).addTo(map);
      map.fitBounds(line.getBounds(), { padding:[26, 26] });
      if (o.car) L.marker((o.line && o.line.length > 2) ? o.line[Math.floor(o.line.length / 2)] : o.car, { icon:L.divIcon({ html:`<div style="width:34px">${carArt('hatch','#1f2630','#dce5ec')}</div>`,
        className:'', iconSize:[34,16], iconAnchor:[17,8] }) }).addTo(map);
    } else {
      map.setView(c, o.zoom || 16);
      if (o.marker) L.marker(c, { icon:L.divIcon({ html:pinSVG(o.marker === 'dest' ? '#e1252b' : '#12a150'),
        className:'', iconSize:[24,34], iconAnchor:[12,34] }) }).addTo(map);
    }
    if (o.pin){
      const wrap = el.parentElement;
      map.on('movestart', () => wrap.classList.add('dragging'));
      map.on('moveend', () => { wrap.classList.remove('dragging');
        const p = map.getCenter(); if (onMove) onMove(o.pin, p.lat, p.lng); });
    }
    setTimeout(() => map.invalidateSize(), 60);
  });
}

/* ຂໍຕຳແໜ່ງປັດຈຸບັນ (ໃຊ້ໄດ້ໃນ https ຫຼື localhost) */
function askGeo(cb){
  if (GEO.pos){ cb(GEO.pos); return; }
  if (!navigator.geolocation){ GEO.tried = true; cb(null); return; }
  navigator.geolocation.getCurrentPosition(
    r => { GEO.pos = { lat:r.coords.latitude, lng:r.coords.longitude }; GEO.tried = true; cb(GEO.pos); },
    () => { GEO.tried = true; cb(null); },
    { enableHighAccuracy:true, timeout:6000, maximumAge:60000 });
}

/* ແປພິກັດເປັນທີ່ຢູ່ (Nominatim) — ຖ້າລົ້ມເຫຼວໃຊ້ພິກັດແທນ */
function reverseGeo(lat, lng, cb){
  const fb = `ພິກັດ ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=lo`)
    .then(r => r.ok ? r.json() : null)
    .then(j => cb(j && j.display_name ? j.display_name.split(',').slice(0, 3).join(', ') : fb))
    .catch(() => cb(fb));
}

/* ============================================================
   ຄິວອາໂຄດ (QR) — ໃຊ້ qrcode-generator ຖ້າໂຫຼດໄດ້
   ບໍ່ດັ່ງນັ້ນວາດລວດລາຍຈຳລອງ (ບໍ່ສະແກນໄດ້ ແຕ່ໜ້າຕາຄືກັນ)
   ============================================================ */
function qrBox(payload, size){
  return `<div class="qrimg" data-qr="${encodeURIComponent(payload)}" style="width:${size}px;height:${size}px"></div>`;
}
function fakeQR(payload, n){
  let h = 0; for (let i = 0; i < payload.length; i++) h = (h * 31 + payload.charCodeAt(i)) >>> 0;
  const rnd = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/>
    <rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  let cells = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!inF && rnd() > .5) cells += `<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" style="width:100%;height:100%"><rect width="${n}" height="${n}" fill="#fff"/>
    ${cells}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}
function mountQR(){
  document.querySelectorAll('.qrimg[data-qr]').forEach(el => {
    if (el._done) return; el._done = true;
    const payload = decodeURIComponent(el.dataset.qr);
    try {
      if (typeof qrcode === 'undefined') throw new Error('no lib');
      const q = qrcode(0, 'M'); q.addData(payload); q.make();
      el.innerHTML = q.createSvgTag({ cellSize:4, margin:0, scalable:true });
      const svg = el.querySelector('svg'); if (svg){ svg.style.width = '100%'; svg.style.height = '100%'; }
    } catch(e){ el.innerHTML = fakeQR(payload, 33); }
  });
}

/* ============================================================
   ຄິດໄລ່ເສັ້ນທາງຈິງຕາມຖະໜົນ (OSRM public server · ບໍ່ຕ້ອງໃຊ້ key)
   ຖ້າເອີ້ນບໍ່ໄດ້ → ຄິດເສັ້ນຊື່ × 1.35 (ຄ່າສະເລ່ຍທາງອ້ອມ)
   ============================================================ */
function haversineKm(a, b){
  const R = 6371, d2r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * d2r, dLng = (b[1] - a[1]) * d2r;
  const x = Math.sin(dLat / 2) ** 2 +
    Math.cos(a[0] * d2r) * Math.cos(b[0] * d2r) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function routeRoad(from, to, cb){
  const url = `https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}`
            + `?overview=full&geometries=geojson&alternatives=false&steps=false`;
  const fallback = () => {
    const km = +(haversineKm(from, to) * 1.35).toFixed(1);
    cb({ km, min: Math.max(3, Math.round(km * 2.6)), line:[from, to], real:false });
  };
  const t = setTimeout(fallback, 6000);
  fetch(url).then(r => r.ok ? r.json() : null).then(j => {
    clearTimeout(t);
    const r0 = j && j.routes && j.routes[0];
    if (!r0 || !r0.geometry) return fallback();
    cb({ km:+(r0.distance / 1000).toFixed(1), min:Math.max(2, Math.round(r0.duration / 60)),
         line:r0.geometry.coordinates.map(c => [c[1], c[0]]), real:true });
  }).catch(() => { clearTimeout(t); fallback(); });
}


/* ============================================================
   ການນຳທາງແບບ realtime
   - ດຶງເສັ້ນທາງຈິງພ້ອມຄຳສັ່ງລ້ຽວຈາກ OSRM (steps=true)
   - ເຄື່ອນລົດຕາມເສັ້ນທາງທຸກວິນາທີ · ອັບເດດ ຄຳສັ່ງ / ໄລຍະ / ETA ສົດ
   - ອັບເດດ DOM ໂດຍກົງ (ບໍ່ render ໜ້າຈໍຄືນ) ເພື່ອບໍ່ໃຫ້ແຜນທີ່ກະພິບ
   ============================================================ */

/* ---- ເລຂາຄະນິດເສັ້ນທາງ ---- */
function cumDist(line){
  const c = [0];
  for (let i = 1; i < line.length; i++) c.push(c[i - 1] + haversineKm(line[i - 1], line[i]) * 1000);
  return c;
}
function bearingOf(a, b){
  const d2r = Math.PI / 180, r2d = 180 / Math.PI;
  const y = Math.sin((b[1] - a[1]) * d2r) * Math.cos(b[0] * d2r);
  const x = Math.cos(a[0] * d2r) * Math.sin(b[0] * d2r) -
            Math.sin(a[0] * d2r) * Math.cos(b[0] * d2r) * Math.cos((b[1] - a[1]) * d2r);
  return (Math.atan2(y, x) * r2d + 360) % 360;
}
/* ຕຳແໜ່ງເມື່ອແລ່ນໄປແລ້ວ m ແມັດ ຕາມເສັ້ນທາງ */
function posAt(line, cum, m){
  const last = cum.length - 1;
  if (m <= 0) return { pos:line[0], bearing:bearingOf(line[0], line[1] || line[0]), idx:0 };
  if (m >= cum[last]) return { pos:line[last], bearing:bearingOf(line[last - 1] || line[last], line[last]), idx:last };
  let i = 1;
  while (i < last && cum[i] < m) i++;
  const seg = cum[i] - cum[i - 1] || 1;
  const t = (m - cum[i - 1]) / seg;
  const a = line[i - 1], b = line[i];
  return { pos:[a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], bearing:bearingOf(a, b), idx:i };
}

/* ---- ຄຳສັ່ງລ້ຽວເປັນພາສາລາວ ---- */
const TURN_LO = {
  'left':'ລ້ຽວຊ້າຍ', 'right':'ລ້ຽວຂວາ',
  'slight left':'ຊິດຊ້າຍ', 'slight right':'ຊິດຂວາ',
  'sharp left':'ລ້ຽວຊ້າຍຫັກສອກ', 'sharp right':'ລ້ຽວຂວາຫັກສອກ',
  'straight':'ໄປຊື່', 'uturn':'ກັບລົດ'
};
function instrText(st){
  if (!st) return 'ໄປຊື່';
  const road = st.name ? ' ເຂົ້າ ' + st.name : '';
  const t = st.type, m = st.mod || 'straight';
  if (t === 'arrive')   return 'ຮອດປາຍທາງ' + (st.mod === 'left' ? ' ຢູ່ເບື້ອງຊ້າຍ' : st.mod === 'right' ? ' ຢູ່ເບື້ອງຂວາ' : '');
  if (t === 'depart')   return 'ເລີ່ມເດີນທາງ' + road;
  if (t === 'roundabout' || t === 'rotary')
    return 'ເຂົ້າວົງວຽນ ອອກທາງອອກທີ ' + (st.exit || 1) + road;
  if (t === 'merge')    return 'ລວມເຂົ້າຊ່ອງ' + road;
  if (t === 'on ramp')  return 'ຂຶ້ນທາງດ່ວນ' + road;
  if (t === 'off ramp') return 'ອອກທາງດ່ວນ' + road;
  if (t === 'fork')     return (m.includes('left') ? 'ແຍກຊ້າຍ' : m.includes('right') ? 'ແຍກຂວາ' : 'ໄປຊື່') + road;
  if (t === 'end of road') return 'ສຸດທາງ · ' + (TURN_LO[m] || 'ໄປຊື່') + road;
  if (t === 'new name' || t === 'continue') return 'ໄປຊື່' + road;
  return (TURN_LO[m] || 'ໄປຊື່') + road;
}
/* ໄອຄອນລູກສອນຕາມທິດລ້ຽວ */
function turnIcon(st){
  const t = st ? st.type : '', m = (st && st.mod) || 'straight';
  if (t === 'arrive') return _s('<circle cx="12" cy="12" r="8"/><path d="M9 12l2 2 4-4"/>');
  if (t === 'roundabout' || t === 'rotary')
    return _s('<circle cx="12" cy="13" r="5"/><path d="M12 21v-3"/><path d="M17 13h4"/><path d="M21 13l-3-3"/>');
  if (m === 'uturn') return _s('<path d="M8 21V11a4 4 0 018 0v4"/><path d="M12 19l4 2 0-4"/>');
  if (m.includes('sharp left'))  return _s('<path d="M16 20V10L7 5"/><path d="M4 9l3-4 4 3"/>');
  if (m.includes('sharp right')) return _s('<path d="M8 20V10l9-5"/><path d="M20 9l-3-4-4 3"/>');
  if (m.includes('slight left'))  return _s('<path d="M12 21v-8l-4-4"/><path d="M5 12V8h4"/>');
  if (m.includes('slight right')) return _s('<path d="M12 21v-8l4-4"/><path d="M19 12V8h-4"/>');
  if (m.includes('left'))  return _s('<path d="M17 21v-8H7"/><path d="M11 8l-4 5 4 5"/>');
  if (m.includes('right')) return _s('<path d="M7 21v-8h10"/><path d="M13 8l4 5-4 5"/>');
  return _s('<path d="M12 21V4"/><path d="M6 10l6-6 6 6"/>');
}
const fmtM = m => m >= 1000 ? (m / 1000).toFixed(1) + ' km'
  : m >= 100 ? Math.round(m / 10) * 10 + ' ແມັດ' : Math.max(0, Math.round(m / 5) * 5) + ' ແມັດ';

/* ---- ດຶງເສັ້ນທາງພ້ອມຄຳສັ່ງລ້ຽວ ---- */
function routeNav(from, to, cb){
  const url = `https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}`
            + `?overview=full&geometries=geojson&alternatives=false&steps=true`;
  const fallback = () => {
    const line = [from, to], cum = cumDist(line), total = cum[1];
    cb({ line, cum, km:+(total / 1000).toFixed(1), min:Math.max(2, Math.round(total / 11.1 / 60)), real:false,
         steps:[{ m:0, dist:total, name:'', type:'depart', mod:'straight' },
                { m:total, dist:0, name:'', type:'arrive', mod:'straight' }] });
  };
  const t = setTimeout(fallback, 7000);
  fetch(url).then(r => r.ok ? r.json() : null).then(j => {
    clearTimeout(t);
    const r0 = j && j.routes && j.routes[0];
    if (!r0 || !r0.geometry) return fallback();
    const line = r0.geometry.coordinates.map(c => [c[1], c[0]]);
    const cum = cumDist(line);
    let acc = 0;
    const steps = ((r0.legs && r0.legs[0] && r0.legs[0].steps) || []).map(s => {
      const o = { m:acc, dist:s.distance, dur:s.duration, name:s.name || '',
                  type:(s.maneuver || {}).type || 'continue', mod:(s.maneuver || {}).modifier || '',
                  exit:(s.maneuver || {}).exit };
      acc += s.distance; return o;
    });
    if (!steps.length) steps.push({ m:0, dist:r0.distance, name:'', type:'depart', mod:'straight' },
                                  { m:r0.distance, dist:0, name:'', type:'arrive', mod:'straight' });
    cb({ line, cum, steps, km:+(r0.distance / 1000).toFixed(1),
         min:Math.max(2, Math.round(r0.duration / 60)), real:true });
  }).catch(() => { clearTimeout(t); fallback(); });
}

/* ---- ເຄື່ອງຈັກນຳທາງ ---- */
const NAV = { on:false, R:null, m:0, speed:11.1, timer:null, cb:null, follow:true, muted:false, spoke:null };
const navCarSVG = () => `<div class="navcar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l7 18-7-4-7 4z"/></svg></div>`;

function navStart(R, cb, opt = {}){
  navStop();
  NAV.R = R; NAV.m = opt.m || 0; NAV.cb = cb || null; NAV.on = true;
  NAV.speed = opt.speed || 11.1;          /* ~40 km/h */
  NAV.follow = opt.follow !== false;
  NAV.spoke = null;
  navBindMaps();
  navStep(0);
  NAV.timer = setInterval(() => navStep(), 1000);
}
function navStop(){ if (NAV.timer) clearInterval(NAV.timer); NAV.timer = null; NAV.on = false; }
function navSkipTo(frac){ if (!NAV.R) return; NAV.m = NAV.R.cum[NAV.R.cum.length - 1] * frac; navStep(0); }

function navState(){
  const R = NAV.R; if (!R) return null;
  const total = R.cum[R.cum.length - 1] || 1;
  const m = Math.min(NAV.m, total);
  const p = posAt(R.line, R.cum, m);
  const nx = R.steps.find(s => s.m > m + 2) || R.steps[R.steps.length - 1];
  const remain = Math.max(0, total - m);
  const secs = remain / NAV.speed;
  return { m, total, remain, prog:m / total,
           remainKm:+(remain / 1000).toFixed(1),
           remainMin:Math.max(1, Math.round(secs / 60)),
           eta:etaClock(secs), pos:p.pos, bearing:p.bearing,
           step:nx, toTurn:Math.max(0, nx.m - m), done:remain <= 6 };
}
/* ເວລາຮອດປາຍທາງ (ໂມງ) */
function etaClock(secs){
  const d = new Date(Date.now() + secs * 1000);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function navStep(adv){
  if (!NAV.R) return;
  const step = adv === 0 ? 0 : NAV.speed * (0.8 + Math.random() * 0.4);
  NAV.m = Math.min(NAV.m + step, NAV.R.cum[NAV.R.cum.length - 1]);
  const st = navState();
  navPaintMap(st);
  navPaintUI(st);
  navSpeak(st);
  if (NAV.cb) NAV.cb(st);
  if (st.done) navStop();
}
/* ແຈ້ງດ້ວຍສຽງ (ຈຳລອງ — ຂຶ້ນເປັນ toast ຄັ້ງດຽວຕໍ່ຄຳສັ່ງ) */
function navSpeak(st){
  if (NAV.muted || !st.step) return;
  const key = st.step.m + '|' + (st.toTurn > 300 ? 'far' : st.toTurn > 80 ? 'near' : 'now');
  if (NAV.spoke === key) return;
  NAV.spoke = key;
  if (st.toTurn > 300 || st.step.type === 'depart') return;
  if (typeof toast === 'function')
    toast('🔊 ອີກ ' + fmtM(st.toTurn) + ' · ' + instrText(st.step));
}

/* ---- ຜູກກັບແຜນທີ່ Leaflet ---- */
function navPruneMaps(){
  Object.keys(MAPS).forEach(id => { if (!document.getElementById(id)) delete MAPS[id]; });
}
function navBindMaps(){
  navPruneMaps();
  if (typeof L === 'undefined' || !NAV.R) return;
  Object.keys(MAPS).forEach(id => {
    const M = MAPS[id]; if (!M || !M.o || !M.o.nav) return;
    if (M.rest) M.map.removeLayer(M.rest);
    if (M.doneLine) M.map.removeLayer(M.doneLine);
    M.doneLine = L.polyline(NAV.R.line, { color:'#9aa7b4', weight:7, opacity:.55, lineCap:'round' }).addTo(M.map);
    M.rest = L.polyline(NAV.R.line, { color:'#2b6cf6', weight:8, opacity:.95, lineCap:'round', lineJoin:'round' }).addTo(M.map);
    if (!M.car) M.car = L.marker(NAV.R.line[0],
      { icon:L.divIcon({ html:navCarSVG(), className:'', iconSize:[40,40], iconAnchor:[20,20] }), zIndexOffset:900 }).addTo(M.map);
    if (!M.destPin) M.destPin = L.marker(NAV.R.line[NAV.R.line.length - 1],
      { icon:L.divIcon({ html:pinSVG('#e1252b'), className:'', iconSize:[24,34], iconAnchor:[12,34] }) }).addTo(M.map);
    M.map.setView(NAV.R.line[0], 16);
  });
}
function navPaintMap(st){
  if (typeof L === 'undefined' || !st) return;
  Object.keys(MAPS).forEach(id => {
    const M = MAPS[id]; if (!M || !M.car) return;
    M.car.setLatLng(st.pos);
    const el = M.car.getElement && M.car.getElement();
    if (el){ const c = el.querySelector('.navcar'); if (c) c.style.transform = 'rotate(' + st.bearing.toFixed(0) + 'deg)'; }
    if (M.rest){
      const R = NAV.R, i = posAt(R.line, R.cum, st.m).idx;
      M.rest.setLatLngs([st.pos].concat(R.line.slice(i)));
    }
    if (NAV.follow) M.map.panTo(st.pos, { animate:true, duration:.9 });
  });
}
/* ອັບເດດຂໍ້ຄວາມນຳທາງໃນ DOM ໂດຍກົງ (ບໍ່ render ໜ້າຈໍຄືນ) */
function navPaintUI(st){
  const set = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== v) e.textContent = v; };
  set('navDist',   fmtM(st.toTurn));
  set('navInstr',  instrText(st.step));
  set('navRemain', st.remainKm + ' km');
  set('navMin',    st.remainMin + ' ນາທີ');
  set('navEta',    st.eta);
  set('navSpeed',  Math.round(NAV.speed * 3.6) + ' km/h');
  const ic = document.getElementById('navIcon'); if (ic) ic.innerHTML = turnIcon(st.step);
  const pr = document.getElementById('navProg'); if (pr) pr.style.width = Math.round(st.prog * 100) + '%';
  const nx = document.getElementById('navThen');
  if (nx && NAV.R){ const after = NAV.R.steps.find(s => s.m > st.step.m + 2);
    nx.textContent = after ? 'ຈາກນັ້ນ ' + instrText(after) : 'ຈາກນັ້ນ ຮອດປາຍທາງ'; }
}

/* ============================================================
   ແຊັດກັບລູກຄ້າແບບ realtime + ແປພາສາອັດຕະໂນມັດ
   - ຂໍ້ຄວາມເຂົ້າເອງ (ຈຳລອງ WebSocket) · ຕົວບອກ “ກຳລັງພິມ”
   - ສະຖານະ ສົ່ງແລ້ວ → ສົ່ງເຖິງ → ອ່ານແລ້ວ
   - ແປສອງທາງ: ລູກຄ້າເຫັນພາສາລູກຄ້າ · ຄົນຂັບເຫັນພາສາລາວ
   - ອັບເດດ DOM ໂດຍກົງ ບໍ່ render ໜ້າຈໍຄືນ (ຮັກສາຕຳແໜ່ງ scroll)
   ============================================================ */
const CHAT = { open:false, job:null, msgs:[], unread:0, typing:false, autoTr:true, timers:[], seq:0, onChange:null };
const chatClock = () => { const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const chatLang = () => (CHAT.job && CHAT.job.paxLang) || 'lo';
const chatNeedTr = () => CHAT.autoTr && chatLang() !== 'lo';
const _cT = (fn, ms) => CHAT.timers.push(setTimeout(fn, ms));
const chatClearTimers = () => { CHAT.timers.forEach(clearTimeout); CHAT.timers = []; };

/* ຄຳຕອບອັດຕະໂນມັດຂອງລູກຄ້າ (ຂຽນເປັນລາວ ແລ້ວແປໄປພາສາລູກຄ້າ) */
const CHAT_REPLY = [
  { k:['ຮອດແລ້ວ','ລໍຢູ່ໜ້າປະຕູ'], r:'ອອກມາດຽວນີ້ 🙏' },
  { k:['3 ນາທີ','2 ນາທີ'],        r:'ໂອເຄ ລໍໄດ້' },
  { k:['ລົດຕິດ'],                  r:'ບໍ່ເປັນຫຍັງ ຂັບປອດໄພເດີ້' },
  { k:['ຈອດບ່ອນນີ້ບໍ່ໄດ້','ຍ້າຍ'], r:'ໄດ້ ຂ້ອຍຍ່າງມາຫາ' },
  { k:['ຂອບໃຈ'],                   r:'ຂອບໃຈເຊັ່ນກັນ 🙏' }
];
const CHAT_IDLE = ['ຮອດແລ້ວບໍ?', 'ຂ້ອຍໃສ່ເສື້ອສີຟ້າ', 'ຂໍເວລາ 2 ນາທີ'];

function chatOpen(job, seed, onChange){
  chatClearTimers();
  const fresh = !CHAT.job || !job || CHAT.job.id !== job.id;
  CHAT.job = job || CHAT.job;
  CHAT.onChange = onChange || CHAT.onChange;
  if (fresh){ CHAT.msgs = []; CHAT.seq = 0;
    (seed || []).forEach(m => m.who === 'me' ? chatSend(m.tx, true) : chatRecv(m.tx, true)); }
  CHAT.open = true; CHAT.unread = 0;
  chatPaint(); chatIdleTimer();
}
function chatLeave(){ CHAT.open = false; chatClearTimers(); chatPaint(); }
function chatStop(){ chatClearTimers(); CHAT.open = false; CHAT.job = null; CHAT.msgs = []; CHAT.unread = 0; CHAT.typing = false; }

/* ---- ຄົນຂັບສົ່ງ (ພິມເປັນລາວ → ແປໄປພາສາລູກຄ້າ) ---- */
function chatSend(loText, quiet){
  if (!loText || !loText.trim()) return;
  const to = chatLang();
  const out = to === 'lo' ? null : translate(loText, to).text;
  const m = { id:++CHAT.seq, who:'me', text:loText.trim(), tr:out, lang:'lo',
              t:chatClock(), status:'sent' };
  CHAT.msgs.push(m);
  chatPaint();
  if (quiet){ m.status = 'read'; return; }
  _cT(() => { m.status = 'deliv'; chatPaint(); }, 700);
  _cT(() => { m.status = 'read';  chatPaint(); }, 1800);
  chatAutoReply(loText);
  chatIdleTimer();
}
/* ---- ລູກຄ້າສົ່ງ (ພາສາລູກຄ້າ → ແປເປັນລາວໃຫ້ຄົນຂັບ) ---- */
function chatRecv(loSeed, quiet){
  const from = chatLang();
  const shown = from === 'lo' ? loSeed : translate(loSeed, from).text;   /* ຕົ້ນສະບັບຂອງລູກຄ້າ */
  const m = { id:++CHAT.seq, who:'them', text:shown, tr:from === 'lo' ? null : loSeed,
              lang:from, t:chatClock() };
  CHAT.msgs.push(m);
  CHAT.typing = false;
  if (!CHAT.open && !quiet){
    CHAT.unread++;
    if (typeof toast === 'function') toast('💬 ' + (CHAT.job ? CHAT.job.pax : 'ລູກຄ້າ') + ': ' + loSeed);
  }
  chatPaint();
  if (CHAT.onChange) CHAT.onChange(m);
  if (!quiet) chatIdleTimer();
}
/* ຕອບກັບອັດຕະໂນມັດ: ຂຶ້ນ “ກຳລັງພິມ” ກ່ອນ ແລ້ວຄ່ອຍສົ່ງ */
function chatAutoReply(loText){
  const row = CHAT_REPLY.find(x => x.k.some(k => loText.includes(k)));
  const reply = row ? row.r : ['ໂອເຄ ລໍໄດ້', 'ຮັບຊາບ 🙏', 'ໄດ້ເລີຍ'][Math.floor(Math.random() * 3)];
  _cT(() => { CHAT.typing = true; chatPaint(); }, 1200);
  _cT(() => chatRecv(reply), 2900 + Math.random() * 900);
}
/* ລູກຄ້າທັກມາເອງເມື່ອງຽບດົນ */
function chatIdleTimer(){
  _cT(() => {
    if (!CHAT.job) return;
    const last = CHAT.msgs[CHAT.msgs.length - 1];
    if (last && last.who === 'them') return;
    CHAT.typing = true; chatPaint();
    _cT(() => chatRecv(CHAT_IDLE[Math.floor(Math.random() * CHAT_IDLE.length)]), 1800);
  }, 11000);
}
function chatToggleTr(){ CHAT.autoTr = !CHAT.autoTr; chatPaint(); return CHAT.autoTr; }

/* ---- ວາດ ---- */
const TICK = { sent:'✓', deliv:'✓✓', read:'✓✓' };
function chatBubble(m, lang, autoTr){
  lang = lang || chatLang();
  const tr = (autoTr === undefined ? CHAT.autoTr : autoTr) && lang !== 'lo';
  if (m.who === 'me'){
    return `<div class="msg me">${esc(m.text)}
      ${tr && m.tr ? `<span class="tr">${langOf(lang).f} ${esc(m.tr)}</span>` : ''}
      <i class="meta">${m.t}<b class="tick ${m.status}">${TICK[m.status] || '✓'}</b></i></div>`;
  }
  const main = tr && m.tr ? m.tr : m.text;
  const orig = tr && m.tr ? m.text : null;
  return `<div class="msg them">${esc(main)}
    ${orig ? `<span class="tr">${langOf(m.lang).f} ${esc(orig)}</span>` : ''}
    <i class="meta">${m.t}</i></div>`;
}
function chatPaint(){
  const list = document.getElementById('chatList');
  if (list){
    list.innerHTML = `<div class="dp">ມື້ນີ້</div>`
      + CHAT.msgs.map(chatBubble).join('')
      + (CHAT.typing ? `<div class="msg them typing"><i></i><i></i><i></i></div>` : '');
    list.scrollTop = list.scrollHeight;
  }
  const sub = document.getElementById('chatSub');
  if (sub) sub.textContent = CHAT.typing ? 'ກຳລັງພິມ…'
    : chatLang() === 'lo' ? 'ອອນລາຍ' : 'ເວົ້າ' + langOf(chatLang()).n + ' · ແປອັດຕະໂນມັດ' + (CHAT.autoTr ? 'ເປີດ' : 'ປິດ');
  const tg = document.getElementById('chatTr');
  if (tg) tg.className = 'trbtn ' + (CHAT.autoTr ? 'on' : '');
  document.querySelectorAll('.chatbadge').forEach(e => {
    e.textContent = CHAT.unread || '';
    e.style.display = CHAT.unread ? 'grid' : 'none';
  });
}

/* ============================================================
   ປຸ່ມເລື່ອນເພື່ອຢືນຢັນ — ໃຊ້ໄດ້ທັງເມົ້າ ແລະ ນິ້ວ
   <div class="slideconfirm" data-act="acceptBid" data-v="d1">
   ============================================================ */
const slideTrack = (label, act, v) => `
  <div class="slideconfirm" data-act="${act}" data-v="${v}">
    <div class="track">
      <span class="lbl">${label}</span>
      <i class="knob">${I('arrow')}</i>
    </div>
    <div class="hint">ເລື່ອນປຸ່ມໄປທາງຂວາຈົນສຸດເພື່ອຢືນຢັນ</div>
  </div>`;

let _slide = null;
function _slideXY(e){ return e.touches ? e.touches[0].clientX : e.clientX; }
function _slideStart(e){
  const k = e.target.closest && e.target.closest('.slideconfirm .knob');
  if (!k) return;
  const el = k.closest('.slideconfirm'), track = el.querySelector('.track');
  if (el.classList.contains('done')) return;
  _slide = { el, k, startX:_slideXY(e), max:track.clientWidth - k.offsetWidth - 8, moved:false };
  el.classList.add('dragging');
}
function _slideMove(e){
  if (!_slide) return;
  const x = Math.max(0, Math.min(_slide.max, _slideXY(e) - _slide.startX));
  if (x > 3) _slide.moved = true;
  _slide.k.style.transform = `translateX(${x}px)`;
  _slide.el.style.setProperty('--p', (x / _slide.max).toFixed(3));
}
function _slideEnd(){
  if (!_slide) return;
  const { el, k, max, moved } = _slide; _slide = null;
  el.classList.remove('dragging');
  const p = parseFloat(el.style.getPropertyValue('--p') || 0);
  if (p >= 0.82){
    k.style.transition = 'transform .15s'; k.style.transform = `translateX(${max}px)`;
    el.style.setProperty('--p', 1); el.classList.add('done');
    k.innerHTML = ICONS.check;
    const act = el.dataset.act, v = el.dataset.v;
    setTimeout(() => {
      /* ACTIONS ປະກາດດ້ວຍ const → ບໍ່ຢູ່ໃນ window ຕ້ອງອ້າງອີງໂດຍກົງ */
      if (typeof ACTIONS !== 'undefined' && typeof ACTIONS[act] === 'function'){
        ACTIONS[act]({ v });
        if (typeof paintDemo === 'function') paintDemo();
      }
    }, 220);
  } else {
    k.style.transition = 'transform .22s'; k.style.transform = 'translateX(0)';
    el.style.setProperty('--p', 0);
    setTimeout(() => k.style.transition = '', 240);
    if (!moved && typeof toast === 'function') toast('ເລື່ອນປຸ່ມໄປທາງຂວາເພື່ອຢືນຢັນ →');
  }
}
document.addEventListener('pointerdown', _slideStart);
document.addEventListener('pointermove', _slideMove);
document.addEventListener('pointerup', _slideEnd);
document.addEventListener('pointercancel', _slideEnd);
document.addEventListener('touchstart', _slideStart, { passive:true });
document.addEventListener('touchmove', _slideMove, { passive:true });
document.addEventListener('touchend', _slideEnd);

/* ============================================================
   screens.js — ຊິ້ນສ່ວນຮ່ວມ + ໜ້າຈໍໄຫຼການຮັບງານ D01–D19
   ທຸກ function ຮັບ state object ແລະ ຄືນ HTML ຂອງໜ້າຈໍທັງໜ້າ
   ============================================================ */

/* ---------- ສູດຄິດໄລ່ຂອງຄົນຂັບ ----------
   ຄ່າໂດຍສານເປັນຂອງບໍລິສັດ · ຄົນຂັບໄດ້ “ຄ່າຖ້ຽວ” = ຄົງທີ່ + % ຂອງຄ່າໂດຍສານ */
const rndK      = n => Math.round(n / 1000) * 1000;
const waitFeeOf = sec => Math.max(0, Math.ceil(sec / 60) - CFG.freeWaitMin) * CFG.waitFee;
/* ---- ສູດເງິນ ----
   ຄ່າໂດຍສານທັງໝົດເປັນຂອງຄົນຂັບ · ຄ່າທຳນຽມປັດຈຸບັນ 0% (feeOf() ຈຶ່ງເປັນ 0 ທຸກຖ້ຽວ) */
const feeOf     = fare => Math.round(fare * feePctOf() / 100) * 100;
/* ລາຍໄດ້ສຸດທິຈາກ 1 ຖ້ຽວ (ບໍ່ລວມທິບ) */
const earnOf    = fare => fare - feeOf(fare);
/* ຄ່າທຳນຽມຄ້າງຈ່າຍ */
const feeList   = s => (s && s.fees) || FEES;
const feeTotal  = s => feeList(s).reduce((a, c) => a + c.amt, 0);
const feePct    = s => Math.min(100, Math.round(feeTotal(s) / CFG.feeDueLimit * 100));
/* ---- ກະເປົາເງິນ ---- */
const walBal  = s => (s && s.wallet && s.wallet.balance !== undefined) ? s.wallet.balance : WALLET.balance;
const walAuto = s => (s && s.wallet && s.wallet.autoFee !== undefined) ? s.wallet.autoFee : WALLET.autoFee;
const walTx   = s => (s && s.walTx) || WALLET_TX;
/* ຍອດທີ່ຖອນໄດ້ = ຍອດເງິນ − ຄ່າທຳນຽມຄ້າງ (ຖ້າເປີດຫັກອັດຕະໂນມັດ) */
const walFree = s => Math.max(0, walBal(s) - (walAuto(s) ? feeTotal(s) : 0));
const walShort = s => walAuto(s) && walBal(s) < feeTotal(s);

/* ລະດັບຄົນຂັບ ຕາມຄະແນນດາວ — ໃຫ້ສິດທິປະໂຫຍດດ້ານງານ (ບໍ່ແມ່ນສ່ວນຫຼຸດຄ່າທຳນຽມແລ້ວ) */
const tierOf    = (r = ME.rating) => [...TIERS].reverse().find(t => r >= t.min) || TIERS[0];
const feePctOf  = () => CFG.commissionPct;
const zeroFee   = () => CFG.commissionPct === 0;

/* ---------- ບັນຊີຮັບເງິນຂອງຄົນຂັບເອງ + ປາຍທາງຂອງເງິນ ----------
   ເງິນສົດ → ມືຄົນຂັບ · QR → ບັນຊີຄົນຂັບໂດຍກົງ · ກະເປົາ → ລະບົບ
---------------------------------------------------------------- */
const pqOn   = s => (((s && s.payqr) || PAYQR).on !== false);
const pqList = s => (s && Array.isArray(s.payqrs)) ? s.payqrs : PAYQRS;
const pqMain = s => pqList(s).find(q => q.primary) || pqList(s)[0] || null;
const pqById = (s, id) => pqList(s).find(q => q.id === id) || null;
const pq = s => { const m = pqMain(s);
  return { ...(m || { bankKey:'bcel', acc:'', holder:'', nick:'', verified:false, updated:'—', scans30:0, recv30:0 }),
           on: pqOn(s) && !!m }; };
const accOk = a => String(a || '').replace(/\D/g, '').length >= 8;
const fmtAcc = v => String(v || '').replace(/\D/g, '').replace(/(.{4})/g, '$1 ').trim();
const payName = m => m === 'cash' ? 'ເງິນສົດ' : m === 'qr' ? 'QR ບັນຊີຂ້ອຍ' : 'ກະເປົາເງິນ';
const payDest = m => m === 'cash' ? 'ມືທ່ານໂດຍກົງ'
                   : m === 'qr'   ? 'ບັນຊີທະນາຄານທ່ານໂດຍກົງ'
                                  : 'ກະເປົາເງິນໃນແອັບ';
const payThruSystem = m => m === 'wallet';
const nextTier  = (r = ME.rating) => TIERS.find(t => t.min > r) || null;
const curJob    = s => s.job || JOBS[0];
const jobFare   = s => (s.bidPrice || curJob(s).offer) + waitFeeOf(s.waitSec || 0);
const canOnline = s => feeTotal(s) < CFG.feeDueLimit && !DOCS.some(d => d.days <= 0);
const mmss      = sec => String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
const ll        = p => [p.lat, p.lng];

}

      <div class="gostate">${blocked ? '⚠️ ຕິດເງື່ອນໄຂ — ເບິ່ງລຸ່ມນີ້' : 'ພັກຢູ່ · ກົດເພື່ອອອນລາຍ'}</div>
    </div>

    <div class="grp">ສະຫຼຸບມື້ນີ້</div>
    <div class="card2" style="padding:14px">
      <div class="statrow">
        <div><b>${t.trips}</b><span>ຖ້ຽວ</span></div>
        <div><b>${(earnOf(t.fare) + t.tips).toLocaleString()}</b><span>ລາຍໄດ້ (ກີບ)</span></div>
        <div><b>${t.hours}</b><span>ຊົ່ວໂມງ</span></div>
      </div>
      <div class="goalbar"><i style="width:${Math.round(ME.rating / 5 * 100)}%"></i></div>
      <div class="goaltx"><span>${stars(Math.round(ME.rating))} ${ME.rating.toFixed(1)} · ລະດັບ${tierOf().n}</span>
        <b>${nextTier() ? '+' + (nextTier().min - ME.rating).toFixed(1) + '★ → ' + nextTier().n : 'ລະດັບສູງສຸດ 🏆'}</b></div>
    </div>

    ${zeroFee() ? `
    <div class="grp">ຄ່າທຳນຽມ</div>
    <div class="card2 zerofee" data-act="goWallet">
      <div class="hd">${I('gift')}<b>0%</b><span class="rt">${I('chevR')}</span></div>
      <div class="ft">ຄ່າໂດຍສານ ແລະ ທິບເປັນຂອງທ່ານ <b>100%</b> · ໂປຣໂມຊັນຮອດ ${CFG.zeroFeeUntil}</div>
    </div>` : `
    <div class="grp">ຄ່າທຳນຽມຄ້າງຈ່າຍ</div>
    <div class="card2 cashcard ${feePct(s) >= 100 ? 'over' : feePct(s) >= 70 ? 'warn' : ''}" data-act="goPayFee">
      <div class="hd">${I('coins')}<b>${money(feeTotal(s))}</b>
        <span class="rt">${I('chevR')}</span></div>
      <div class="bar"><i style="width:${feePct(s)}%"></i></div>
      <div class="ft">ຂີດຈຳກັດ ${money(CFG.feeDueLimit)} · ຕັດຍອດ${CFG.feeCycle}</div>
    </div>`}

    <div class="grp">ຕ້ອງເບິ່ງ</div>
    <div class="card2">
      ${DOCS.filter(d => d.warn).map(d => rowItem({ ic:'alert', color:'#f0921f', t:d.n + ' ໃກ້ໝົດອາຍຸ',
        s:'ເຫຼືອ ' + d.days + ' ວັນ · ໝົດ ' + d.exp, act:'goDocs' })).join('')}
      ${rowItem({ ic:'bell', color:'#e1252b', t:'ປະກາດຈາກບໍລິສັດ', s:ANNOUNCE[0].title, act:'goAnnounce' })}
    </div>
    <div style="height:10px"></div>
  </div>
  ${navBar('home', s)}${gestureBar}`;
}

/* ============================================================
   D06 · ໜ້າຫຼັກ — ອອນລາຍ
   ============================================================ */
function scrOnline(s){
  const queue = JOBS.slice(0, 3);
  return `<div class="sb">${statusBar('21:43')}</div>
  <div class="sbody" style="background:var(--d-bg);padding:0">
    <div class="onlinebar"><span class="dot"></span><b>ອອນລາຍ · ພ້ອມຮັບງານ</b>
      <span class="tm">${I('timer')} ລໍ 00:48</span>
      <i data-act="goOffline">${I('pause')}</i></div>
    ${mapFor(s, { h:230, center:ll(CFG.center), zoom:14, marker:'pickup', btnTop:10 })}
    <div class="zonerow">
      <b class="hot">${I('fire')} ສີໂຄດຕະບອງ ×1.4</b>
      <b>ຈັນທະບູລີ ×1.1</b><b>ໄຊເສດຖາ ×1.0</b><b>ສີສັດຕະນາກ ×0.9</b>
    </div>
    <div class="grp">ງານທີ່ເປີດຢູ່ (${queue.length}) <span class="grpmore" data-act="goJobs">ເບິ່ງທັງໝົດ</span></div>
    ${queue.map(j => jobCard(j, s)).join('')}
    <div class="safenote">💡 ຢູ່ໂຊນສີແດງ ໄດ້ງານໄວກວ່າ ແລະ ຄ່າຖ້ຽວຄູນເພີ່ມຕາມຕົວຄູນຂອງໂຊນ</div>
    <div style="height:10px"></div>
  </div>
  ${navBar('home', s)}${gestureBar}`;
}

/* ບັດງານ (ໃຊ້ຮ່ວມ D06 · D07) */
function jobCard(j, s){
  return `<div class="jobc ${j.hot ? 'hot' : ''}" data-act="openJob" data-v="${j.id}">
    <div class="hd">${kindTag(j.kind)}
      ${j.kind === 'pick' ? '<span class="pickme">ເລືອກທ່ານ</span>' : ''}
      <span class="rt">${I('nav')} ${j.dist} km · ${j.eta} ນາທີ</span></div>
    ${routeRow(j.from, j.to)}
    <div class="ft">
      <span class="pay ${j.pay}">${I(j.pay === 'cash' ? 'cash' : 'wallet')}${j.pay === 'cash' ? 'ເງິນສົດ' : 'ກະເປົາເງິນ'}</span>
      <span class="km">${j.km} km · ${j.min} ນາທີ</span>
      <b>${money(j.offer)}</b></div>
    <div class="fee">${zeroFee() ? 'ທ່ານໄດ້ເຕັມ' : 'ລາຍໄດ້ສຸດທິ'} <b>${money(earnOf(j.offer))}</b>
      <span>${zeroFee() ? '(ຄ່າທຳນຽມ 0%)' : '(ຫັກຄ່າທຳນຽມ ' + money(feeOf(j.offer)) + ')'}</span></div>
  </div>`;
}

/* ============================================================
   D07 · ຄິວງານທີ່ເປີດຢູ່
   ============================================================ */
function scrJobList(s){
  const f = s.jobFilter || 'all';
  const sort = s.jobSort || 'near';
  let list = JOBS.filter(j => f === 'all' || j.kind === f);
  list = [...list].sort((a, b) => sort === 'near' ? a.dist - b.dist : b.offer - a.offer);
  list = [...list].sort((a, b) => (b.kind === 'pick') - (a.kind === 'pick'));
  return `<div class="sb">${statusBar('21:43')}</div>
  ${appHead('ຄິວງານ', { noBack:true, right:I('refresh'), rightAct:'refreshJobs' })}
  <div class="sbody">
    <div class="segs">
      ${[['all','ທັງໝົດ'],['taxi','ທັນທີ'],['sched','ຈອງລ່ວງໜ້າ'],['charter','ເໝົາລົດ']]
        .map(([k, l]) => `<b class="${f === k ? 'on' : ''}" data-act="jobFilter" data-v="${k}">${l}</b>`).join('')}
    </div>
    <div class="sortrow">ຮຽງຕາມ:
      <b class="${sort === 'near' ? 'on' : ''}" data-act="jobSort" data-v="near">ໃກ້ທີ່ສຸດ</b>
      <b class="${sort === 'pay' ? 'on' : ''}" data-act="jobSort" data-v="pay">ລາຄາສູງສຸດ</b>
      <span class="rt">${list.length} ງານ</span></div>
    ${list.length ? list.map(j => jobCard(j, s)).join('')
      : `<div class="empty">${I('search')}<b>ບໍ່ພົບງານໃນໝວດນີ້</b><span>ລອງຍ້າຍໄປໂຊນຄວາມຕ້ອງການສູງ ຫຼື ປ່ຽນຕົວກັ່ນຕອງ</span></div>`}
    <div style="height:10px"></div>
  </div>
  ${navBar('home', s)}${gestureBar}`;
}

/* ============================================================
   D08 · ງານໃໝ່ເຂົ້າ (ນັບຖອຍຫຼັງ)
   ============================================================ */
function scrJobOffer(s){
  const j = curJob(s), sec = s.popSec ?? CFG.jobPopSec;
  const pct = sec / CFG.jobPopSec;
  const special = j.kind === 'charter' ? 'goCharterJob' : j.kind === 'drivemine' ? 'goDriveMineJob' : null;
  return appScreen({ time:'21:44', title:'ງານໃໝ່', head:false, bodyStyle:'background:var(--d-bg)', body:`
    <div class="offerhead">
      <div class="ring" style="--p:${pct}"><b>${sec}</b><span>ວິ</span></div>
      <div class="tx">${kindTag(j.kind)}
        <b>${j.when ? j.when : 'ຮັບທັນທີ'}</b>
        <span>${I('nav')} ຫ່າງຈາກທ່ານ ${j.dist} km · ໄປຮັບ ${j.eta} ນາທີ</span></div>
    </div>
    <div class="card2" style="padding:12px 14px">${routeRow(j.from, j.to)}
      <div class="jline"><span>ໄລຍະ ແລະ ເວລາ</span><b>${j.km} km · ${j.min} ນາທີ</b></div>
      <div class="jline"><span>ວິທີຈ່າຍ</span><b>${j.pay === 'cash' ? '💵 ເງິນສົດ (ຮັບເອງ)' : '👛 ກະເປົາເງິນ (ໂອນເຂົ້າບັນຊີ)'}</b></div>
    </div>
    <div class="offerprice">
      <div><span>ລູກຄ້າສະເໜີ</span><b>${money(j.offer)}</b></div>
      <div class="mine"><span>ລາຍໄດ້ຂອງທ່ານ</span><b>${money(earnOf(j.offer))}</b></div>
    </div>
    ${j.note ? `<div class="paxnote">${I('info')}<span>${j.note}</span></div>` : ''}
    <div class="grp">ລູກຄ້າ</div>
    <div class="card2">${paxCard(j, false)}</div>
    ${special ? `<div class="staffnote">${I('alert')}<span>ງານນີ້ເປັນ <b>${kindOf(j.kind).n}</b> —
      ມີໃບງານສະເພາະ ກະລຸນາອ່ານກ່ອນຮັບ</span></div>
      <div style="padding:0 12px"><div class="btn ored" data-act="${special}">ເປີດໃບງານ${kindOf(j.kind).n}</div></div>` : ''}
    <div class="grow"></div>
    <div class="btm"><div class="row2">
      <div class="btn plain" data-act="declineJob">ປະຕິເສດ</div>
      <div class="btn pri" data-act="goBid">ສະເໜີລາຄາ</div></div></div>` });
}

/* ============================================================
   D09 · ສະເໜີລາຄາ
   ============================================================ */
function scrBid(s){
  const j = curJob(s);
  const price = s.bidPrice || j.offer;
  const avg = rndK(j.offer * 1.06);
  const high = price > avg;
  const low = price < CFG.minFare;
  return appScreen({ time:'21:44', title:'ສະເໜີລາຄາ', body:`
    <div class="card2" style="padding:12px 14px;margin-bottom:2px">${routeRow(j.from, j.to)}</div>
    <div class="grp">ລາຄາທີ່ທ່ານສະເໜີ</div>
    <div class="pricebox">
      <i class="${price <= Math.max(CFG.minFare, j.offer) ? 'dis' : ''}" data-act="bidMinus">−</i>
      <div class="v"><b>${price.toLocaleString()}</b><span>${CFG.currency}</span></div>
      <i data-act="bidPlus">+</i>
    </div>
    <div class="quickbid">
      <b class="${price === j.offer ? 'on' : ''}" data-act="bidSet" data-v="${j.offer}">ຕາມລູກຄ້າ</b>
      <b class="${price === j.offer + 5000 ? 'on' : ''}" data-act="bidSet" data-v="${j.offer + 5000}">+5,000</b>
      <b class="${price === j.offer + 10000 ? 'on' : ''}" data-act="bidSet" data-v="${j.offer + 10000}">+10,000</b>
    </div>
    <div class="cmpbar">
      <div class="track"><i style="left:${Math.min(96, Math.max(2, (price / (avg * 1.5)) * 100))}%"></i>
        <s style="left:${(avg / (avg * 1.5)) * 100}%"></s></div>
      <div class="lg"><span>ຂັ້ນຕ່ຳ ${CFG.minFare.toLocaleString()}</span><span>ຄ່າສະເລ່ຍເສັ້ນທາງນີ້ ${avg.toLocaleString()}</span></div>
    </div>
    ${high ? `<div class="warnrow">${I('alert')}<span>ສູງກວ່າຄ່າສະເລ່ຍ ${money(price - avg)} — ໂອກາດຖືກເລືອກຫຼຸດລົງ</span></div>` : ''}
    ${low ? `<div class="warnrow bad">${I('alert')}<span>ຕ່ຳກວ່າຂັ້ນຕ່ຳລະບົບ ${money(CFG.minFare)} — ສົ່ງບໍ່ໄດ້</span></div>` : ''}
    <div class="grp">ຖ້າລູກຄ້າເລືອກທ່ານ</div>
    <div class="card2" style="padding:12px 14px">
      <div class="fline"><span>ຄ່າໂດຍສານທີ່ລູກຄ້າຈ່າຍ</span><span>${money(price)}</span></div>
      <div class="fline"><span>ຄ່າທຳນຽມບໍລິການ ${Math.round(feePctOf() * 100)}%${zeroFee() ? ' <em class="ptag ok">ໂປຣ</em>' : ''}</span>
        <span style="color:${zeroFee() ? 'var(--d-ok)' : 'var(--d-bad)'}">${zeroFee() ? '0' : '−' + money(feeOf(price))}</span></div>
      <div class="fline total"><span>ທ່ານໄດ້ຮັບ</span><span style="color:var(--d-ok)">${money(earnOf(price))}</span></div>
    </div>
    <div class="grow"></div>
    <div class="btm">
      <div class="btmsum"><span>ລູກຄ້າມີເວລາຕັດສິນໃຈ ${CFG.bidWindowSec} ວິນາທີ</span><b>${money(price)}</b></div>
      <div class="btn ${low ? 'dis' : 'pri'}" data-act="submitBid">ສົ່ງລາຄາໃຫ້ລູກຄ້າ</div></div>` });
}

/* ============================================================
   D10 · ລໍລູກຄ້າເລືອກ
   ============================================================ */
function scrBidWait(s){
  const j = curJob(s), sec = s.bidSec ?? CFG.bidWindowSec;
  const rank = s.bidRank || 2, n = s.bidders || 4;
  return appScreen({ time:'21:45', title:'ລໍລູກຄ້າຕັດສິນໃຈ', body:`
    <div class="waitbig">
      <div class="pulsering"><b>${mmss(sec)}</b></div>
      <b>ສົ່ງລາຄາແລ້ວ ${money(s.bidPrice || j.offer)}</b>
      <span>ລູກຄ້າກຳລັງເລືອກຈາກຄົນຂັບ ${n} ຄົນ</span>
    </div>
    <div class="grp">ອັນດັບລາຄາຂອງທ່ານ</div>
    <div class="card2" style="padding:12px 14px">
      ${Array.from({ length:n }, (_, i) => {
        const me = i + 1 === rank;
        return `<div class="rankrow ${me ? 'me' : ''}">
          <i>${i + 1}</i><span>${me ? 'ລາຄາຂອງທ່ານ' : 'ຄົນຂັບ ' + String.fromCharCode(65 + i)}</span>
          <b>${me ? money(s.bidPrice || j.offer) : money(rndK((s.bidPrice || j.offer) * (1 + (i + 1 - rank) * 0.09)))}</b></div>`;
      }).join('')}
      <div class="ranknote">ລູກຄ້າເຫັນລາຄາ, ຄະແນນ ແລະ ເວລາໄປຮັບຂອງທຸກຄົນ — ບໍ່ເຫັນຊື່ຈົນກວ່າຈະເລືອກ</div>
    </div>
    <div class="safenote">⏳ ລະຫວ່າງລໍ ທ່ານຍັງເບິ່ງງານອື່ນໃນຄິວໄດ້ — ຖ້າລູກຄ້າເລືອກທ່ານ ລະບົບຈະແຈ້ງທັນທີ</div>
    <div class="simrow">ຈຳລອງຜົນ (ສຳລັບເດໂມ):
      <b class="ok" data-act="simWin">ລູກຄ້າເລືອກທ່ານ</b>
      <b data-act="simLose">ເລືອກຄົນອື່ນ</b></div>
    <div class="grow"></div>
    <div class="btm"><div class="row2">
      <div class="btn plain" data-act="withdrawBid">ຖອນລາຄາ</div>
      <div class="btn ored" data-act="goJobs">ເບິ່ງງານອື່ນ</div></div></div>` });
}

/* ============================================================
   D12 · ຮອດຈຸດຮັບ · ລໍລູກຄ້າ
   ============================================================ */
function scrArrived(s){
  const j = curJob(s), sec = s.waitSec || 0;
  const fee = waitFeeOf(sec), free = sec < CFG.freeWaitMin * 60;
  const canCancel = sec >= 600;
  return `<div class="sb">${statusBar('21:49')}</div>
  <div class="sbody" style="padding:0;background:var(--d-bg)">
    ${mapFor(s, { h:180, center:ll(j.from), zoom:17, marker:'pickup', btns:false })}
    <div class="waitbox ${free ? '' : 'fee'}">
      <div class="tm">${mmss(sec)}</div>
      <b>${free ? 'ລໍຟຣີ · ເຫຼືອ ' + mmss(CFG.freeWaitMin * 60 - sec) : 'ກຳລັງຄິດຄ່າລໍ ' + money(fee)}</b>
      <span>${free ? `ຟຣີ ${CFG.freeWaitMin} ນາທີ ຈາກນັ້ນ ${CFG.waitFee.toLocaleString()} ກີບ/ນາທີ`
        : `ຄ່າລໍຈະບວກເຂົ້າຄ່າໂດຍສານອັດຕະໂນມັດ`}</span>
    </div>
    <div class="card2">${paxCard(j)}</div>
    <div class="grp">ແຈ້ງລູກຄ້າດ່ວນ</div>
    <div class="quick">${QUICK.slice(0, 4).map(q => `<b data-act="quickMsg" data-v="${q}">${q}</b>`).join('')}</div>
    <div class="grp">ຈຸດຮັບ</div>
    <div class="card2">${rowItem({ ic:'pin', color:'#12a150', t:j.from.name, s:j.from.addr, chev:false })}</div>
    <div style="padding:8px 12px 4px">${slideTrack('ລູກຄ້າຂຶ້ນລົດແລ້ວ · ເລີ່ມການເດີນທາງ', 'startTrip', '')}</div>
    <div class="linkred ${canCancel ? '' : 'dim'}" data-act="${canCancel ? 'goCancel' : 'waitMore'}">
      ${canCancel ? 'ຍົກເລີກໄດ້ຟຣີ (ລໍເກີນ 10 ນາທີ)' : 'ຍົກເລີກໄດ້ຟຣີເມື່ອລໍຄົບ 10 ນາທີ'}</div>
  </div>${gestureBar}`;
}

/* ============================================================

   ============================================================ */
/* ============================================================
   ຊິ້ນສ່ວນນຳທາງ realtime (ໃຊ້ຮ່ວມ D17 ໄປຮັບ · D19 ເດີນທາງ)
   ຄ່າເລີ່ມຕົ້ນເປັນ seed ເທົ່ານັ້ນ — navPaintUI() ຈະຂຽນທັບທຸກວິນາທີ

const navSeed = { m:0, dist:240, instr:'ໄປຊື່ ເຂົ້າ ຖະໜົນ ໄກສອນ ພົມວິຫານ', then:'ຈາກນັ້ນ ລ້ຽວຂວາ' };

const navBanner = (seed = navSeed) => `
  <div class="navtop">
    <div class="row">
      <i id="navIcon">${turnIcon({ type:'continue', mod:'straight' })}</i>
      <div class="tx"><b id="navDist">${fmtM(seed.dist)}</b><span id="navInstr">${seed.instr}</span></div>

const navMap = (s, h = 330) => `

    </div>

    <div class="navprog"><i id="navProg" style="width:0%"></i></div>
  </div>`;

const navFoot = (kmSeed, minSeed) => `
  <div class="navfoot">
    <div><b id="navEta">—</b><span>ຮອດເວລາ</span></div>
    <div><b id="navRemain">${kmSeed} km</b><span>ເຫຼືອ</span></div>

/* ============================================================
   D17 · ໄປຮັບລູກຄ້າ (ນຳທາງ realtime)
   ============================================================ */
function scrToPickup(s){

function scrOnTrip(s){

/* ============================================================
   D20 · ແຊັດກັບລູກຄ້າ (realtime + ແປອັດຕະໂນມັດ)
   ============================================================ */
/* ແປງຂໍ້ຄວາມຕົວຢ່າງເປັນຮູບແບບຂອງ engine (ໃຊ້ຕອນ render ໃນ gallery) */
const chatSeed = (s, lang) => (s.messages || []).map(m => {
  const tx = m.tx || (m.type === 'loc' ? 'ຕຳແໜ່ງປັດຈຸບັນຂອງຂ້ອຍ 📍' : '');
  return m.who === 'me'
    ? { who:'me', text:tx, tr:lang === 'lo' ? null : translate(tx, lang).text, lang:'lo', t:m.t, status:'read' }
    : { who:'them', text:lang === 'lo' ? tx : translate(tx, lang).text,
        tr:lang === 'lo' ? null : tx, lang, t:m.t };
});

function scrChat(s){
  const j = curJob(s);
  const lang = j.paxLang || 'lo';
  const seeded = chatSeed(s, lang);
  return `<div class="sb">${statusBar('21:51')}</div>
  <div class="chead">
    <span class="bk" data-act="leaveChat">${I('back')}</span>
    <div class="av">${personArt(j.face || 'user')}<em></em></div>
    <div class="tx"><b>${j.pax}</b><span id="chatSub">${lang === 'lo' ? 'ອອນລາຍ'
      : 'ເວົ້າ' + langOf(lang).n + ' · ແປອັດຕະໂນມັດເປີດ'}</span></div>
    ${lang === 'lo' ? '' : `<i id="chatTr" class="trbtn on" data-act="chatTr" title="ເປີດ/ປິດ ການແປ">${I('globe')}</i>`}
    <i class="cal" data-act="callPax">${I('phone')}</i>
  </div>
  ${lang === 'lo' ? '' : `<div class="trbar">${I('globe')}<span>ລູກຄ້າເວົ້າ<b>${langOf(lang).n}</b> ${langOf(lang).f} —
    ຂໍ້ຄວາມຖືກແປອັດຕະໂນມັດທັງສອງທາງ</span></div>`}
  <div class="sbody chat" id="chatList">
    <div class="dp">ມື້ນີ້</div>
    ${seeded.map(m => chatBubble(m, lang, true)).join('')}
  </div>
  <div class="quick">${QUICK.map(q => `<b data-act="quickMsg" data-v="${q}">${q}</b>`).join('')}</div>
  <div class="cinput">
    <i data-act="shareLoc" title="ສົ່ງຕຳແໜ່ງ">${I('locate')}</i>
    <input id="chatInput" class="box" placeholder="ພິມເປັນພາສາລາວ — ລະບົບແປໃຫ້ເອງ" autocomplete="off">
    <i class="send" data-act="sendMsg">${I('send')}</i>
  </div>${gestureBar}`;
}

/* ============================================================
   D15 · ຈົບການເດີນທາງ & ຮັບເງິນ
   ============================================================ */
function scrCollect(s){
  const j = curJob(s);

  return appScreen({ time:'22:08', title:'ຈົບການເດີນທາງ', head:false, body:`
    <div class="donehead ${paid ? 'ok' : ''}">

      <b>${paid ? 'ຮັບເງິນຮຽບຮ້ອຍ' : 'ຮອດປາຍທາງແລ້ວ'}</b>
      <span>${j.from.name} → ${j.to.name} · ${j.km} km · ${j.min} ນາທີ</span>
    </div>

    <div class="card2" style="padding:12px 14px">
      <div class="fline"><span>ຄ່າໂດຍສານທີ່ຕົກລົງ</span><span>${money(s.bidPrice || j.offer)}</span></div>
      ${waitFeeOf(s.waitSec || 0) ? `<div class="fline"><span>ຄ່າລໍ</span><span>${money(waitFeeOf(s.waitSec || 0))}</span></div>` : ''}
      ${s.stops ? `<div class="fline"><span>ຈຸດແວ່ເພີ່ມ</span><span>${money(s.stops * 10000)}</span></div>` : ''}
      ${tip ? `<div class="fline"><span>ທິບຈາກລູກຄ້າ 🎉</span><span style="color:var(--d-ok)">+${money(tip)}</span></div>` : ''}
      <div class="fline total"><span>ລວມ</span><span>${money(fare + tip)}</span></div>
    </div>
    <div class="grp">ວິທີຮັບເງິນ</div>
    <div class="paygrid3">
      ${[['cash','ເງິນສົດ','cash'],['qr','QR ບັນຊີຂ້ອຍ','qr'],['wallet','ຫັກກະເປົາລູກຄ້າ','wallet']]
        .map(([k, n, ic]) => `<b class="${m === k ? 'on' : ''}" data-act="payMethod" data-v="${k}">${I(ic)}${n}</b>`).join('')}
    </div>
    ${m === 'qr' ? (pq(s).on ? `<div class="card2 qrmini">${qrBox(payqrPayload(pq(s), fare + tip), 132)}

        <span>${pq(s).holder}</span>
        <em class="amt">${money(fare + tip)}</em></div></div>
      <div class="safenote">🏦 ເປັນ <b>ບັນຊີຂອງທ່ານເອງ</b> — ເງິນເຂົ້າບັນຊີທະນາຄານທ່ານ<b>ໂດຍກົງ</b>
        ບໍ່ຜ່ານລະບົບ ແລະ <b>ບໍ່ຕ້ອງຖອນ</b></div>`
    : `<div class="warnrow bad">${I('alert')}<span>ທ່ານຍັງ<b>ບໍ່ທັນຜູກບັນຊີຮັບເງິນ</b> — ຜູກກ່ອນຈຶ່ງສ້າງ QR ໄດ້</span></div>
       <div style="padding:0 12px"><div class="btn ored" data-act="goPayQR">ຜູກບັນຊີຮັບເງິນ (QR)</div></div>`) : ''}
    ${m === 'cash' ? (zeroFee()
      ? `<div class="safenote">💵 ເງິນສົດເປັນຂອງທ່ານ <b>ທັງໝົດ</b> — ບໍ່ຕ້ອງນຳສົ່ງ ແລະ ບໍ່ມີຄ່າທຳນຽມ</div>`

    <div class="grp">ລາຍໄດ້ຂອງທ່ານ</div>
    <div class="card2 earnrow"><div>${I('coins')}<b>${money(earnOf(fare) + tip)}</b></div>
      <span>${zeroFee() ? 'ຄ່າໂດຍສານ ' + money(fare) + ' (ຄ່າທຳນຽມ 0%)'
        : 'ຄ່າໂດຍສານ ' + money(fare) + ' − ຄ່າທຳນຽມ ' + money(feeOf(fare))}${tip ? ' + ທິບ ' + money(tip) : ''}</span></div>
    <div class="card2 gonote">${I(m === 'wallet' ? 'wallet' : 'bank')}<span>ເງິນເຂົ້າ <b>${payDest(m)}</b></span></div>
    <div class="grow"></div>
    <div class="btm"><div class="btn pri" data-act="collectPay">${m === 'cash' ? 'ຮັບເງິນສົດແລ້ວ'
      : m === 'qr' ? 'ຢືນຢັນໄດ້ຮັບເງິນ' : 'ຢືນຢັນຫັກກະເປົາ'}</div></div>` });

/* ============================================================
   D16 · ໃຫ້ຄະແນນລູກຄ້າ

function scrRatePax(s){

  return appScreen({ time:'22:09', title:'ໃຫ້ຄະແນນລູກຄ້າ', head:false, body:`
    <div class="ratebox">
      <div class="av">${personArt(j.face || 'user')}</div>
      <b>${j.pax}</b>
      <span>ໃຫ້ຄະແນນເພື່ອຊ່ວຍພະນັກງານຄົນອື່ນ (ລູກຄ້າບໍ່ເຫັນ)</span>
      <div class="stars big">${[1,2,3,4,5].map(i => `<i class="${i <= r ? 'on' : ''}" data-act="ratePax" data-v="${i}">${I('star')}</i>`).join('')}</div>
      ${r ? `<div class="ratelabel">${RATE_LABEL[r]}</div>` : ''}
    </div>
    ${r ? `<div class="grp">ເລືອກປ້າຍຄຳ</div>
    <div class="tagchips">${tags.map(t => `<b class="${(s.paxTags || []).includes(t) ? 'on' : ''}"
      data-act="paxTag" data-v="${t}">${t}</b>`).join('')}</div>` : ''}
    <div class="grp">ສະຫຼຸບຖ້ຽວນີ້</div>
    <div class="card2" style="padding:12px 14px">
      <div class="fline"><span>ຄ່າໂດຍສານ</span><span>${money(fare)}</span></div>
      <div class="fline"><span>ຄ່າທຳນຽມ ${Math.round(feePctOf() * 100)}%</span>
        <span style="color:${zeroFee() ? 'var(--d-ok)' : 'var(--d-bad)'}">${zeroFee() ? '0' : '−' + money(feeOf(fare))}</span></div>
      <div class="fline"><span>ວິທີຈ່າຍ</span><span>${payName(s.payMethod)}</span></div>
      <div class="fline"><span>ເງິນເຂົ້າ</span><span>${payDest(s.payMethod)}</span></div>
      <div class="fline total"><span>ລາຍໄດ້ສຸດທິ + ທິບ</span><span style="color:var(--d-ok)">${money(earnOf(fare) + (s.tip || 0))}</span></div>
    </div>

    <div class="btm"><div class="row2">
      <div class="btn plain" data-act="finishJob">ຂ້າມ</div>
      <div class="btn pri" data-act="finishJob">ສົ່ງ ແລະ ຮັບງານຕໍ່</div></div></div>` });
}

/* ============================================================
   D17 · ເຫດຜົນການຍົກເລີກ

      <span>ອັດຕາປັດຈຸບັນ ${ME.accept}% · ຕ້ອງຮັກສາໃຫ້ເກີນ ${CFG.acceptTarget}%</span></div></div>

        ${x.free ? '<em class="freetag">ບໍ່ຫັກຄະແນນ</em>' : ''}
        <i class="rad ${s.reason === x.id ? 'on' : ''}"></i></div>`).join('')}
    </div>

  return `<div class="sb">${statusBar('21:48')}</div>
  ${appHead('ປະຫວັດງານ', { noBack:true, right:I('filter'), rightAct:'soon' })}

        .map(([k, l]) => `<b class="${f === k ? 'on' : ''}" data-act="histFilter" data-v="${k}">${l}</b>`).join('')}
    </div>
    <div class="sumrow"><span>${list.length} ງານ</span><b>ຄ່າຖ້ຽວລວມ ${money(sum)}</b></div>

        <div class="hd">${kindTag(t.kind)}
          <span class="st ${t.status === 'done' ? 'ok' : 'no'}">${t.status === 'done' ? 'ສຳເລັດ' : 'ຍົກເລີກ'}</span></div>
        <div class="rt">
          <div class="line"><i></i><s></s><i class="b"></i></div>
          <div class="ad"><div>${t.from}</div><div>${t.to}</div></div>
        </div>
        <div class="ft"><span style="font-size:11px;color:var(--d-dim)">${t.date}</span>
          ${t.rating ? stars(t.rating) : ''}

      </div>`).join('')

    <div style="height:10px"></div>
  </div>
  ${navBar('history', s)}${gestureBar}`;
}

    </div>
    <div class="pricebox" style="margin-top:9px">
      <i class="${amt <= 0 ? 'dis' : ''}" data-act="wdMinus">−</i>
      <div class="v"><b>${amt.toLocaleString()}</b><span>${CFG.currency}</span></div>

    ${over ? `<div class="warnrow bad">${I('alert')}<span>ເກີນຍອດທີ່ຖອນໄດ້</span></div>` : ''}

      ${rowItem({ ic:'ccard', color:'#5a9bf0', t:WALLET.bank.name + ' ···' + WALLET.bank.last,
        s:WALLET.bank.holder, r:'<b class="mini">ປ່ຽນ</b>', act:'soon' })}

    <div class="grp">ສະຫຼຸບ</div>

      <div class="fline total"><span>ໄດ້ຮັບຈິງ</span><span style="color:var(--d-ok)">${money(net)}</span></div>
    </div>

      <div class="btmsum"><span>ຍອດຫຼັງຖອນ ${money(walBal(s) - amt)}</span><b>${money(net)}</b></div>
      <div class="btn ${low || over ? 'dis' : 'pri'}" data-act="confirmWithdraw">ຢືນຢັນຖອນເງິນ</div></div>` });

  manual:false, langs:['ລາວ'], zone:'', carType:'sedan', carModel:'', carYear:'', carPlate:'',
  docs:[], verify:[], otp:'', agree:[], ...(s.apply || {}) });
const apSteps = ['ຂໍ້ມູນສ່ວນຕົວ','ໃບຂັບຂີ່ & ລົດ','ແນບເອກະສານ','ຢືນຢັນຕົວຕົນ'];
const apBar = n => `<div class="apbar">${apSteps.map((t, i) => `
  <div class="st ${i + 1 < n ? 'done' : i + 1 === n ? 'on' : ''}"><i>${i + 1 < n ? I('check') : i + 1}</i><span>${t}</span></div>`).join('')}</div>`;
const apOk1 = a => !!(a.name && a.dob && a.idno && a.phone && a.village);
const apOk2 = a => !!(a.licNo && a.licExp && a.years && licOk(a.licType) && a.carModel && a.carPlate);
const apOk3 = a => APPLY_DOCS.filter(d => d.req).every(d => a.docs.includes(d.k));
const apOk4 = a => VERIFY_STEPS.every(v => a.verify.includes(v.k));

/* ============================================================
   D44 · ເພີ່ມ / ແກ້ໄຂບັນຊີຮັບເງິນ — ຄົນຂັບເຮັດເອງ
